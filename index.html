<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATALHA NO MAR 8D - IA AVANÇADA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #00060f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .container { text-align: center; }
    h1 {
      font-size: 3.5rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #00ffff, #00ffcc, #00ffff);
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 0 50px #00ffff;
    }
    .game-info {
      font-size: 1.7rem;
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      gap: 50px;
    }
    canvas {
      border: 7px solid #00ddff;
      border-radius: 20px;
      box-shadow: 0 0 60px rgba(0, 221, 255, 0.8);
    }
    button {
      margin-top: 20px;
      padding: 16px 50px;
      font-size: 1.4rem;
      background: linear-gradient(#ff3366, #cc0022);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { transform: scale(1.1); }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚓ BATALHA NO MAR 8D - IA AVANÇADA ⚓</h1>
    <div class="game-info">
      <span>Pontos: <strong id="score">0</strong></span>
      <span>Vidas: <strong id="lives">3</strong></span>
      <span>Nível: <strong id="level">1</strong></span>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <p style="margin-top:15px; opacity:0.8;">← → ↑ ↓ Mover | ESPAÇO ou Clique = Atirar</p>
    <button onclick="restartGame()">Novo Jogo</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let score = 0, lives = 3, level = 1, gameOver = false;

    const player = { x: 350, y: 400, width: 95, height: 75, speed: 9 };

    let bullets = [], enemies = [], explosions = [], enemyBullets = [], keys = {};

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);
    canvas.addEventListener('click', shoot);
    window.addEventListener('keypress', e => { if (e.key === ' ') shoot(); });

    function shoot() {
      if (gameOver) return;
      bullets.push({ x: player.x + 47, y: player.y - 12, width: 10, height: 32, speed: 16 });
    }

    class Explosion {
      constructor(x, y) {
        this.x = x; this.y = y; this.size = 22; this.life = 32;
      }
      update() { this.life--; this.size += 2.2; }
      draw() {
        ctx.fillStyle = `rgba(255, ${this.life*12}, 40, ${this.life/32})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
      }
    }

    function createEnemy() {
      const isBig = Math.random() < 0.4;
      enemies.push({
        x: Math.random() * (canvas.width - 90),
        y: -80,
        width: isBig ? 90 : 70,
        height: isBig ? 70 : 55,
        speed: 1.6 + level * 0.5,
        type: isBig ? 'big' : 'normal',
        direction: Math.random() < 0.5 ? 1 : -1,   // IA: direção horizontal
        shootTimer: Math.random() * 60
      });
    }

    function drawOcean() {
      ctx.fillStyle = '#000a1f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(0, 180, 255, 0.35)';
      ctx.lineWidth = 6;
      for (let i = 0; i < 10; i++) {
        ctx.beginPath();
        const base = 50 + i * 55;
        ctx.moveTo(0, base);
        for (let x = 0; x < canvas.width; x += 20) {
          ctx.lineTo(x, base + Math.sin(x/40 + Date.now()/300) * 25);
        }
        ctx.stroke();
      }
    }

    function drawPlayer() {
      const px = player.x, py = player.y;
      const hull = ctx.createLinearGradient(px+10, py+35, px+10, py+72);
      hull.addColorStop(0, '#00f0d0');
      hull.addColorStop(1, '#006b55');
      ctx.fillStyle = hull;
      ctx.beginPath();
      ctx.moveTo(px + 8, py + 65);
      ctx.lineTo(px + 87, py + 65);
      ctx.lineTo(px + 75, py + 33);
      ctx.lineTo(px + 20, py + 33);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#007766';
      ctx.fillRect(px + 16, py + 31, 63, 22);

      ctx.fillStyle = '#002211';
      ctx.fillRect(px + 27, py + 17, 40, 20);

      ctx.fillStyle = '#bbffaa';
      ctx.fillRect(px + 32, py + 20, 7, 7);
      ctx.fillRect(px + 43, py + 20, 7, 7);
      ctx.fillRect(px + 54, py + 20, 7, 7);

      ctx.fillStyle = '#111111';
      ctx.fillRect(px + 19, py + 11, 14, 24);
      ctx.fillRect(px + 62, py + 11, 14, 24);

      ctx.fillStyle = '#ff1a1a';
      ctx.fillRect(px + 30, py + 54, 35, 9);

      ctx.fillStyle = '#ffff44';
      ctx.beginPath();
      ctx.arc(px + 47, py + 4, 6, 0, Math.PI*2);
      ctx.fill();
    }

    function update() {
      if (gameOver) return;

      // Movimento do jogador
      if (keys['ArrowLeft'])  player.x -= player.speed;
      if (keys['ArrowRight']) player.x += player.speed;
      if (keys['ArrowUp'])    player.y -= player.speed;
      if (keys['ArrowDown'])  player.y += player.speed;

      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
      player.y = Math.max(150, Math.min(480, player.y));

      bullets = bullets.filter(b => { b.y -= b.speed; return b.y > -40; });

      // ==================== IA AVANÇADA DOS INIMIGOS ====================
      enemies.forEach((e, i) => {
        e.y += e.speed;

        // Movimento horizontal inteligente
        e.x += e.direction * 1.8;
        if (e.x <= 20 || e.x >= canvas.width - e.width - 20) {
          e.direction *= -1;   // Inverte direção ao bater na borda
        }

        // IA: Atira quando o jogador está alinhado ou em intervalos
        e.shootTimer--;
        if (e.shootTimer <= 0) {
          const distX = Math.abs(e.x + e.width/2 - (player.x + player.width/2));
          if (distX < 80) {  // Só atira se estiver relativamente alinhado
            enemyBullets.push({ 
              x: e.x + e.width/2, 
              y: e.y + e.height, 
              width: 8, 
              height: 25, 
              speed: 7.5 
            });
            e.shootTimer = 45 + Math.random() * 40; // Recarga inteligente
          } else {
            e.shootTimer = 20;
          }
        }

        // Colisão com jogador
        if (e.y + e.height > player.y && e.x < player.x + player.width && e.x + e.width > player.x) {
          lives--;
          explosions.push(new Explosion(player.x + 47, player.y + 35));
          enemies.splice(i, 1);
          if (lives <= 0) gameOver = true;
        }
      });

      enemyBullets = enemyBullets.filter(b => { b.y += b.speed; return b.y < canvas.height; });

      // Colisões
      bullets.forEach((b, bi) => {
        enemies.forEach((e, ei) => {
          if (b.x > e.x && b.x < e.x + e.width && b.y > e.y && b.y < e.y + e.height) {
            bullets.splice(bi, 1);
            explosions.push(new Explosion(e.x + e.width/2, e.y + e.height/2));
            enemies.splice(ei, 1);
            score += e.type === 'big' ? 300 : 120;
          }
        });
      });

      explosions = explosions.filter(exp => { exp.update(); return exp.life > 0; });

      if (score > level * 1000) level++;
      if (Math.random() < 0.045 + level * 0.015) createEnemy();
    }

    function draw() {
      drawOcean();
      drawPlayer();

      ctx.fillStyle = '#ffff00';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

      enemies.forEach(e => {
        ctx.fillStyle = e.type === 'big' ? '#ff4444' : '#ff6666';
        ctx.fillRect(e.x, e.y, e.width, e.height);
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(e.x + 20, e.y + 15, 15, 12);
      });

      ctx.fillStyle = '#ff9900';
      enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

      explosions.forEach(exp => exp.draw());

      document.getElementById('score').textContent = score;
      document.getElementById('lives').textContent = lives;
      document.getElementById('level').textContent = level;

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.9)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff0000';
        ctx.font = 'bold 60px Arial';
        ctx.fillText('GAME OVER', 180, 280);
        ctx.font = '30px Arial';
        ctx.fillStyle = 'white';
        ctx.fillText(`Pontuação: ${score}`, 260, 350);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function restartGame() {
      score = 0; lives = 3; level = 1; gameOver = false;
      bullets = []; enemies = []; explosions = []; enemyBullets = [];
      player.x = 350; player.y = 400;
    }

    gameLoop();
  </script>
</body>
</html>
