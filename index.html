<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudante Aventureiro - vs Professor Matemática</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #000;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #game {
      border: 8px solid #222;
      box-shadow: 0 0 40px rgba(0,0,0,0.9);
      image-rendering: pixelated;
    }
    #menu {
      position: absolute;
      color: white;
      text-align: center;
      width: 800px;
      z-index: 100;
    }
    h1 { 
      font-size: 48px; 
      color: #00FF00; 
      text-shadow: 4px 4px 0 #000; 
      margin-bottom: 10px;
    }
    button {
      font-size: 26px;
      padding: 15px 50px;
      margin: 15px;
      background: #0066FF;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    #scoreDisplay {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 2px 2px 4px black;
      z-index: 50;
    }
  </style>
</head>
<body>

  <div id="scoreDisplay">Pontos: <span id="points">00000</span></div>

  <div id="menu">
    <h1>ESTUDANTE AVENTUREIRO</h1>
    <p>Derrote o <strong>PROFESSOR MATEMÁTICA</strong>!</p>
    <p style="font-size:18px;">← → Mover | ESPAÇO Pular | J Atirar Livro</p>
    <button onclick="startGame()">INICIAR JOGO</button>
  </div>

  <canvas id="game" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const menu = document.getElementById('menu');
    const pointsElement = document.getElementById('points');

    let score = 0;
    let gameState = 'MENU';
    let cameraX = 0;
    const WORLD_WIDTH = 1800;

    const estudante = {
      x: 100, y: 250, width: 48, height: 48,
      speed: 6, jump: -18, velocityY: 0,
      grounded: false, facingRight: true
    };

    const gravity = 0.85;
    const keys = {};

    let platforms = [], coins = [], goombas = [];
    let boss = null;
    let projectiles = [];
    let enemyProjectiles = [];

    function loadLevel() {
      score = 0;
      pointsElement.textContent = "00000";
      estudante.x = 100;
      cameraX = 0;
      projectiles = [];
      enemyProjectiles = [];

      platforms = [
        {x: 0, y: 350, width: WORLD_WIDTH, height: 50},
        {x: 250, y: 280, width: 180, height: 20},
        {x: 550, y: 210, width: 140, height: 20},
        {x: 850, y: 260, width: 200, height: 20},
        {x: 1150, y: 180, width: 150, height: 20},
        {x: 1450, y: 240, width: 120, height: 20},
      ];

      coins = [
        {x: 320, y: 220, collected: false},
        {x: 620, y: 150, collected: false},
        {x: 920, y: 200, collected: false},
        {x: 1220, y: 120, collected: false},
      ];

      goombas = [
        {x: 450, y: 310, width: 40, height: 38, speed: -2, alive: true},
        {x: 780, y: 310, width: 40, height: 38, speed: 2, alive: true},
      ];

      boss = {
        x: 1550, y: 125, width: 85, height: 105,
        health: 12, maxHealth: 12,
        shootTimer: 0
      };
    }

    function startGame() {
      loadLevel();
      menu.style.display = 'none';
      gameState = 'PLAYING';
    }

    function drawBackground() {
      // Céu com gradiente
      const grad = ctx.createLinearGradient(0, 0, 0, 400);
      grad.addColorStop(0, '#5C94FC');
      grad.addColorStop(1, '#A0C4FF');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Nuvens em camadas (parallax)
      ctx.fillStyle = '#FFFFFF';
      ctx.globalAlpha = 0.9;
      ctx.fillRect(80 - cameraX*0.2, 60, 90, 28);
      ctx.fillRect(420 - cameraX*0.2, 45, 110, 30);
      ctx.fillRect(850 - cameraX*0.2, 75, 80, 25);
      ctx.fillRect(1250 - cameraX*0.2, 55, 95, 27);

      ctx.globalAlpha = 0.6;
      ctx.fillRect(200 - cameraX*0.4, 90, 70, 22);
      ctx.fillRect(700 - cameraX*0.4, 70, 85, 25);
      ctx.fillRect(1400 - cameraX*0.4, 100, 65, 20);
      ctx.globalAlpha = 1.0;
    }

    function drawPlatforms() {
      platforms.forEach(p => {
        // Base da plataforma (terra)
        ctx.fillStyle = '#0B6623';
        ctx.fillRect(p.x - cameraX, p.y, p.width, p.height);
        
        // Grama em cima
        ctx.fillStyle = '#0F8B2E';
        ctx.fillRect(p.x - cameraX, p.y, p.width, 8);
        
        // Detalhe de grama
        ctx.fillStyle = '#1EB43C';
        ctx.fillRect(p.x - cameraX + 10, p.y - 4, 8, 6);
        ctx.fillRect(p.x - cameraX + p.width - 25, p.y - 4, 7, 6);
      });
    }

    // ... (drawEstudante, drawGoombas, drawBoss, drawHealthBar permanecem os mesmos)

    function drawEstudante() { /* mesmo código anterior */ }
    function drawGoombas() { /* mesmo código anterior */ }
    function drawBoss() { /* mesmo código anterior */ }
    function drawHealthBar() { /* mesmo código anterior */ }

    function drawCoins() {
      ctx.fillStyle = '#FFD700';
      coins.forEach(coin => {
        if (!coin.collected) {
          ctx.fillRect(coin.x - cameraX + 4, coin.y + 4, 16, 16);
          ctx.fillStyle = '#B8860B';
          ctx.fillRect(coin.x - cameraX + 7, coin.y + 8, 10, 4);
          ctx.fillStyle = '#FFD700';
        }
      });
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      if (keys['ArrowRight'] || keys['d']) { estudante.x += estudante.speed; estudante.facingRight = true; }
      if (keys['ArrowLeft'] || keys['a']) { estudante.x -= estudante.speed; estudante.facingRight = false; }

      if ((keys[' '] || keys['ArrowUp'] || keys['w']) && estudante.grounded) {
        estudante.velocityY = estudante.jump;
        estudante.grounded = false;
      }

      estudante.velocityY += gravity;
      estudante.y += estudante.velocityY;

      estudante.grounded = false;
      for (let p of platforms) {
        if (estudante.x < p.x + p.width && estudante.x + estudante.width > p.x &&
            estudante.y < p.y + p.height && estudante.y + estudante.height > p.y) {
          if (estudante.velocityY > 0) {
            estudante.y = p.y - estudante.height;
            estudante.velocityY = 0;
            estudante.grounded = true;
          }
        }
      }

      // Moedas, Goombas, Tiro, etc... (mantido igual)
      coins.forEach(coin => {
        if (!coin.collected && 
            estudante.x < coin.x + 20 && estudante.x + estudante.width > coin.x &&
            estudante.y < coin.y + 20 && estudante.y + estudante.height > coin.y) {
          coin.collected = true;
          score += 100;
          pointsElement.textContent = String(score).padStart(5, '0');
        }
      });

      goombas.forEach(g => {
        if (!g.alive) return;
        g.x += g.speed;
        if (g.x <= 200 || g.x >= 1400) g.speed *= -1;

        if (estudante.x < g.x + g.width && estudante.x + estudante.width > g.x &&
            estudante.y < g.y + g.height && estudante.y + estudante.height > g.y) {
          if (estudante.velocityY > 0 && estudante.y + estudante.height - 20 < g.y) {
            g.alive = false;
            estudante.velocityY = -13;
            score += 200;
            pointsElement.textContent = String(score).padStart(5, '0');
          } else {
            alert("Você foi pego por um Aluno Rebelde!");
            menu.style.display = 'block';
            gameState = 'MENU';
          }
        }
      });

      if (keys['j'] || keys['J']) {
        if (!estudante.lastShot || Date.now() - estudante.lastShot > 250) {
          projectiles.push({
            x: estudante.facingRight ? estudante.x + 45 : estudante.x - 5,
            y: estudante.y + 28,
            width: 14,
            height: 12,
            speed: estudante.facingRight ? 10 : -10
          });
          estudante.lastShot = Date.now();
        }
      }

      // (resto do update permanece igual)
      for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.speed;
        if (boss && boss.health > 0 && 
            p.x < boss.x + boss.width && p.x + p.width > boss.x &&
            p.y < boss.y + boss.height && p.y + p.height > boss.y) {
          boss.health--;
          projectiles.splice(i, 1);
          if (boss.health <= 0) {
            alert("🏆 VITÓRIA! Você derrotou o Professor Matemática!");
            menu.style.display = 'block';
            gameState = 'MENU';
          }
        }
      }

      if (boss && boss.health > 0) {
        boss.shootTimer++;
        if (boss.shootTimer > 60) {
          enemyProjectiles.push({
            x: boss.x + 45,
            y: boss.y + 55,
            width: 16,
            height: 16,
            speed: -5
          });
          boss.shootTimer = 0;
        }
      }

      for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
        let p = enemyProjectiles[i];
        p.x += p.speed;
        if (estudante.x < p.x + p.width && estudante.x + estudante.width > p.x &&
            estudante.y < p.y + p.height && estudante.y + estudante.height > p.y) {
          alert("Você foi atingido por uma equação difícil!");
          menu.style.display = 'block';
          gameState = 'MENU';
        }
      }

      cameraX = Math.max(0, Math.min(estudante.x - 300, WORLD_WIDTH - canvas.width));
    }

    function draw() {
      drawBackground();
      drawPlatforms();
      drawCoins();
      drawGoombas();
      drawBoss();
      drawHealthBar();
      drawEstudante();

      ctx.fillStyle = '#8B4513';
      projectiles.forEach(p => ctx.fillRect(p.x - cameraX, p.y, p.width, p.height));

      ctx.fillStyle = '#FFFF00';
      enemyProjectiles.forEach(p => ctx.fillRect(p.x - cameraX, p.y, p.width, p.height));
    }

    function gameLoop() {
      update();
      if (gameState === 'PLAYING') draw();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    gameLoop();
  </script>
</body>
</html>
