<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mario Mini</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #5C94FC;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #game {
      border: 4px solid #000;
      border-radius: 8px;
      background: #5C94FC;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    #score {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>

  <div id="score">Pontos: <span id="points">00000</span></div>
  <canvas id="game" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('points');

    let score = 0;
    let gameOver = false;

    // Mario
    const mario = {
      x: 100,
      y: 250,
      width: 40,
      height: 50,
      speed: 5,
      jump: -15,
      velocityY: 0,
      grounded: false
    };

    // Gravidade
    const gravity = 0.8;
    const friction = 0.8;

    // Teclas
    const keys = {};

    // Plataformas
    let platforms = [
      {x: 0, y: 350, width: 800, height: 50},     // chão
      {x: 300, y: 250, width: 150, height: 20},
      {x: 550, y: 180, width: 120, height: 20},
      {x: 150, y: 150, width: 100, height: 20},
      {x: 650, y: 280, width: 150, height: 20},
    ];

    // Moedas
    let coins = [
      {x: 350, y: 200, width: 20, height: 20, collected: false},
      {x: 600, y: 130, width: 20, height: 20, collected: false},
      {x: 200, y: 100, width: 20, height: 20, collected: false},
    ];

    function drawMario() {
      ctx.fillStyle = '#E4000F';
      ctx.fillRect(mario.x, mario.y, mario.width, mario.height);
      
      // Chapéu
      ctx.fillStyle = '#E4000F';
      ctx.fillRect(mario.x + 5, mario.y - 10, 30, 15);
      
      // Rosto
      ctx.fillStyle = '#FFDBB4';
      ctx.fillRect(mario.x + 12, mario.y + 10, 18, 15);
    }

    function drawPlatforms() {
      ctx.fillStyle = '#0B6623';
      platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.width, p.height);
      });
    }

    function drawCoins() {
      ctx.fillStyle = '#FFD700';
      coins.forEach(coin => {
        if (!coin.collected) {
          ctx.beginPath();
          ctx.arc(coin.x + 10, coin.y + 10, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#B8860B';
          ctx.font = '12px Arial';
          ctx.fillText('C', coin.x + 6, coin.y + 15);
          ctx.fillStyle = '#FFD700';
        }
      });
    }

    function update() {
      if (gameOver) return;

      // Movimento horizontal
      if (keys['ArrowRight'] || keys['d']) {
        mario.x += mario.speed;
      }
      if (keys['ArrowLeft'] || keys['a']) {
        mario.x -= mario.speed;
      }

      // Pulo
      if ((keys[' '] || keys['ArrowUp'] || keys['w']) && mario.grounded) {
        mario.velocityY = mario.jump;
        mario.grounded = false;
      }

      // Gravidade
      mario.velocityY += gravity;
      mario.y += mario.velocityY;

      // Colisão com plataformas
      mario.grounded = false;
      for (let p of platforms) {
        if (
          mario.x < p.x + p.width &&
          mario.x + mario.width > p.x &&
          mario.y < p.y + p.height &&
          mario.y + mario.height > p.y
        ) {
          if (mario.velocityY > 0) {
            mario.y = p.y - mario.height;
            mario.velocityY = 0;
            mario.grounded = true;
          }
        }
      }

      // Colisão com moedas
      coins.forEach(coin => {
        if (!coin.collected &&
            mario.x < coin.x + coin.width &&
            mario.x + mario.width > coin.x &&
            mario.y < coin.y + coin.height &&
            mario.y + mario.height > coin.y) {
          coin.collected = true;
          score += 100;
          scoreElement.textContent = String(score).padStart(5, '0');
        }
      });

      // Limites da tela
      if (mario.x < 0) mario.x = 0;
      if (mario.x + mario.width > canvas.width) mario.x = canvas.width - mario.width;

      // Caiu no abismo
      if (mario.y > canvas.height) {
        gameOver = true;
        alert('Game Over! Pontos: ' + score + '\nAtualize a página para jogar novamente.');
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawPlatforms();
      drawCoins();
      drawMario();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Controles
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    // Iniciar jogo
    gameLoop();
  </script>

  <p style="position:absolute;bottom:10px;color:white;text-align:center;width:100%;">
    ← → ou A D : mover | ESPAÇO : pular
  </p>

</body>
</html>
