<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mario Mini - Com Inimigo</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(#5C94FC, #A0C4FF);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #game {
      border: 6px solid #000;
      border-radius: 10px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      image-rendering: pixelated;
    }

    #score {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="score">Pontos: <span id="points">00000</span></div>
  <canvas id="game" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('points');

    let score = 0;
    let gameOver = false;

    const mario = {
      x: 100,
      y: 250,
      width: 45,
      height: 55,
      speed: 6,
      jump: -17,
      velocityY: 0,
      grounded: false,
      facingRight: true
    };

    const gravity = 0.85;
    const keys = {};

    const platforms = [
      {x: 0, y: 350, width: 800, height: 50},
      {x: 200, y: 280, width: 150, height: 20},
      {x: 450, y: 220, width: 130, height: 20},
      {x: 650, y: 160, width: 180, height: 20},
      {x: 100, y: 150, width: 100, height: 20},
    ];

    let coins = [
      {x: 260, y: 230, collected: false},
      {x: 500, y: 170, collected: false},
      {x: 720, y: 110, collected: false},
      {x: 150, y: 100, collected: false},
      {x: 380, y: 250, collected: false},
    ];

    // Goomba (Inimigo)
    let goombas = [
      {x: 380, y: 300, width: 40, height: 35, speed: -2, alive: true},
      {x: 620, y: 300, width: 40, height: 35, speed: 2, alive: true},
    ];

    function drawMario() {
      ctx.save();
      if (!mario.facingRight) {
        ctx.translate(mario.x + mario.width, mario.y);
        ctx.scale(-1, 1);
      } else {
        ctx.translate(mario.x, mario.y);
      }

      // Corpo
      ctx.fillStyle = '#E4000F';
      ctx.fillRect(8, 20, 30, 35);
      // Macacão
      ctx.fillStyle = '#0040A0';
      ctx.fillRect(10, 40, 26, 15);
      // Chapéu
      ctx.fillStyle = '#E4000F';
      ctx.fillRect(5, 10, 35, 15);
      ctx.fillRect(12, 5, 22, 10);
      // Rosto
      ctx.fillStyle = '#FFDBB4';
      ctx.fillRect(15, 22, 18, 18);
      // Olho
      ctx.fillStyle = '#000';
      ctx.fillRect(25, 27, 6, 6);
      // Bigode
      ctx.fillStyle = '#000';
      ctx.fillRect(16, 38, 15, 3);

      ctx.restore();
    }

    function drawPlatforms() {
      ctx.fillStyle = '#0B6623';
      platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.width, p.height);
        ctx.fillStyle = '#0A5A1F';
        ctx.fillRect(p.x, p.y, p.width, 8);
        ctx.fillStyle = '#0B6623';
      });
    }

    function drawCoins() {
      ctx.fillStyle = '#FFD700';
      coins.forEach(coin => {
        if (!coin.collected) {
          ctx.beginPath();
          ctx.arc(coin.x + 10, coin.y + 10, 12, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#B8860B';
          ctx.font = 'bold 14px Arial';
          ctx.fillText('$', coin.x + 6, coin.y + 15);
          ctx.fillStyle = '#FFD700';
        }
      });
    }

    function drawGoombas() {
      goombas.forEach(g => {
        if (g.alive) {
          ctx.fillStyle = '#8B4513';
          ctx.fillRect(g.x, g.y, g.width, g.height);
          ctx.fillStyle = '#000';
          ctx.fillRect(g.x + 8, g.y + 8, 8, 8);   // olho
          ctx.fillRect(g.x + 24, g.y + 8, 8, 8);
        }
      });
    }

    function update() {
      if (gameOver) return;

      // Movimento Mario
      if (keys['ArrowRight'] || keys['d']) {
        mario.x += mario.speed;
        mario.facingRight = true;
      }
      if (keys['ArrowLeft'] || keys['a']) {
        mario.x -= mario.speed;
        mario.facingRight = false;
      }

      // Pulo
      if ((keys[' '] || keys['ArrowUp'] || keys['w']) && mario.grounded) {
        mario.velocityY = mario.jump;
        mario.grounded = false;
      }

      mario.velocityY += gravity;
      mario.y += mario.velocityY;

      // Colisão com plataformas
      mario.grounded = false;
      for (let p of platforms) {
        if (
          mario.x < p.x + p.width &&
          mario.x + mario.width > p.x &&
          mario.y < p.y + p.height &&
          mario.y + mario.height > p.y
        ) {
          if (mario.velocityY > 0) {
            mario.y = p.y - mario.height;
            mario.velocityY = 0;
            mario.grounded = true;
          }
        }
      }

      // Moedas
      coins.forEach(coin => {
        if (!coin.collected &&
            mario.x < coin.x + 20 && mario.x + mario.width > coin.x &&
            mario.y < coin.y + 20 && mario.y + mario.height > coin.y) {
          coin.collected = true;
          score += 100;
          scoreElement.textContent = String(score).padStart(5, '0');
        }
      });

      // Goombas
      goombas.forEach(g => {
        if (!g.alive) return;
        
        g.x += g.speed;

        // Colisão Mario com Goomba
        if (
          mario.x < g.x + g.width && mario.x + mario.width > g.x &&
          mario.y < g.y + g.height && mario.y + mario.height > g.y
        ) {
          if (mario.velocityY > 0 && mario.y + mario.height - 20 < g.y) {
            // Pulou em cima
            g.alive = false;
            mario.velocityY = -12; // pequeno rebote
            score += 200;
            scoreElement.textContent = String(score).padStart(5, '0');
          } else {
            // Tocou de lado ou por baixo
            gameOver = true;
            alert('💀 Game Over!\nPontos: ' + score);
          }
        }

        // Inverte direção do Goomba nas bordas
        if (g.x <= 0 || g.x + g.width >= canvas.width) g.speed *= -1;
      });

      // Limites
      if (mario.x < 0) mario.x = 0;
      if (mario.x + mario.width > canvas.width) mario.x = canvas.width - mario.width;

      if (mario.y > canvas.height) {
        gameOver = true;
        alert('💀 Game Over!\nPontos: ' + score);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawPlatforms();
      drawCoins();
      drawGoombas();
      drawMario();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    gameLoop();
  </script>

  <p style="position:absolute;bottom:15px;color:white;text-align:center;width:100%;font-size:14px;">
    ← → ou A D : mover | ESPAÇO : pular | Pule em cima dos Goombas!
  </p>
</body>
</html>
