<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATALHA NO MAR 8D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #00060f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .container { text-align: center; }
    h1 {
      font-size: 3.6rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #00ffff, #00ffcc, #00ffff);
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 0 50px #00ffff;
    }
    .game-info {
      font-size: 1.7rem;
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      gap: 50px;
    }
    canvas {
      border: 7px solid #00ddff;
      border-radius: 20px;
      box-shadow: 0 0 60px rgba(0, 221, 255, 0.8);
    }
    button {
      margin-top: 20px;
      padding: 16px 50px;
      font-size: 1.4rem;
      background: linear-gradient(#ff3366, #cc0022);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { transform: scale(1.1); }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚓ BATALHA NO MAR 8D ⚓</h1>
    <div class="game-info">
      <span>Pontos: <strong id="score">0</strong></span>
      <span>Vidas: <strong id="lives">3</strong></span>
      <span>Nível: <strong id="level">1</strong></span>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <p style="margin-top:15px; opacity:0.8;">← → ↑ ↓ Mover | ESPAÇO ou Clique = Atirar</p>
    <button onclick="restartGame()">Novo Jogo</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let score = 0, lives = 3, level = 1, gameOver = false;

    const player = { x: 350, y: 400, width: 90, height: 70, speed: 9 };

    let bullets = [], enemies = [], explosions = [], enemyBullets = [], keys = {};

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);
    canvas.addEventListener('click', shoot);
    window.addEventListener('keypress', e => { if (e.key === ' ') shoot(); });

    function shoot() {
      if (gameOver) return;
      bullets.push({ x: player.x + 45, y: player.y - 10, width: 10, height: 30, speed: 16 });
    }

    class Explosion {
      constructor(x, y) {
        this.x = x; this.y = y; this.size = 20; this.life = 30;
      }
      update() { this.life--; this.size += 2; }
      draw() {
        ctx.fillStyle = `rgba(255, ${this.life*10}, 50, ${this.life/30})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
      }
    }

    function createEnemy() {
      const isBig = Math.random() < 0.4;
      enemies.push({
        x: Math.random() * (canvas.width - 90),
        y: -80,
        width: isBig ? 90 : 70,
        height: isBig ? 70 : 55,
        speed: 1.7 + level * 0.5,
        type: isBig ? 'big' : 'normal'
      });
    }

    function drawOcean() {
      ctx.fillStyle = '#000a1f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(0, 180, 255, 0.35)';
      ctx.lineWidth = 6;
      for (let i = 0; i < 10; i++) {
        ctx.beginPath();
        const base = 50 + i * 55;
        ctx.moveTo(0, base);
        for (let x = 0; x < canvas.width; x += 20) {
          ctx.lineTo(x, base + Math.sin(x/40 + Date.now()/300) * 25);
        }
        ctx.stroke();
      }
    }

    // ==================== NAVIO MELHORADO 8D ====================
    function drawPlayer() {
      const px = player.x, py = player.y;

      // Sombra do navio
      ctx.fillStyle = 'rgba(0,0,0,0.4)';
      ctx.beginPath();
      ctx.ellipse(px + 48, py + 68, 38, 8, 0, 0, Math.PI*2);
      ctx.fill();

      // Casco principal com gradiente
      const hullGradient = ctx.createLinearGradient(px, py+30, px, py+70);
      hullGradient.addColorStop(0, '#00e6c8');
      hullGradient.addColorStop(1, '#008866');
      ctx.fillStyle = hullGradient;
      ctx.beginPath();
      ctx.moveTo(px + 8, py + 62);
      ctx.lineTo(px + 82, py + 62);
      ctx.lineTo(px + 72, py + 32);
      ctx.lineTo(px + 18, py + 32);
      ctx.closePath();
      ctx.fill();

      // Linha do casco
      ctx.strokeStyle = '#004d44';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(px + 12, py + 55);
      ctx.lineTo(px + 78, py + 55);
      ctx.stroke();

      // Convés
      ctx.fillStyle = '#006655';
      ctx.fillRect(px + 15, py + 30, 60, 20);

      // Superestrutura (cabine)
      ctx.fillStyle = '#003322';
      ctx.fillRect(px + 28, py + 18, 35, 18);

      // Janelas brilhantes
      ctx.fillStyle = '#aaffff';
      ctx.fillRect(px + 32, py + 21, 6, 6);
      ctx.fillRect(px + 42, py + 21, 6, 6);
      ctx.fillRect(px + 52, py + 21, 6, 6);

      // Canhões
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(px + 20, py + 12, 12, 22);
      ctx.fillRect(px + 58, py + 12, 12, 22);

      // Detalhe vermelho no casco
      ctx.fillStyle = '#ff2222';
      ctx.fillRect(px + 32, py + 52, 26, 8);

      // Luz no topo
      ctx.fillStyle = '#ffff44';
      ctx.beginPath();
      ctx.arc(px + 46, py + 16, 5, 0, Math.PI*2);
      ctx.fill();
    }

    function update() {
      if (gameOver) return;

      if (keys['ArrowLeft'])  player.x -= player.speed;
      if (keys['ArrowRight']) player.x += player.speed;
      if (keys['ArrowUp'])    player.y -= player.speed;
      if (keys['ArrowDown'])  player.y += player.speed;

      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
      player.y = Math.max(150, Math.min(480, player.y));

      bullets = bullets.filter(b => { b.y -= b.speed; return b.y > -40; });

      enemies.forEach((e, i) => {
        e.y += e.speed;
        if (Math.random() < 0.03 + level * 0.007) {
          enemyBullets.push({ x: e.x + e.width/2, y: e.y + e.height, width: 8, height: 25, speed: 8 });
        }
        if (e.y + e.height > player.y && e.x < player.x + player.width && e.x + e.width > player.x) {
          lives--;
          explosions.push(new Explosion(player.x + 45, player.y + 35));
          enemies.splice(i, 1);
          if (lives <= 0) gameOver = true;
        }
      });

      enemyBullets = enemyBullets.filter(b => { b.y += b.speed; return b.y < canvas.height; });

      bullets.forEach((b, bi) => {
        enemies.forEach((e, ei) => {
          if (b.x > e.x && b.x < e.x + e.width && b.y > e.y && b.y < e.y + e.height) {
            bullets.splice(bi, 1);
            explosions.push(new Explosion(e.x + e.width/2, e.y + e.height/2));
            enemies.splice(ei, 1);
            score += e.type === 'big' ? 300 : 120;
          }
        });
      });

      explosions = explosions.filter(exp => { exp.update(); return exp.life > 0; });

      if (score > level * 1000) level++;
      if (Math.random() < 0.05 + level * 0.012) createEnemy();
    }

    function draw() {
      drawOcean();
      drawPlayer();

      ctx.fillStyle = '#ffff00';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

      enemies.forEach(e => {
        ctx.fillStyle = e.type === 'big' ? '#ff4444' : '#ff6666';
        ctx.fillRect(e.x, e.y, e.width, e.height);
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(e.x + 20, e.y + 15, 15, 12);
      });

      ctx.fillStyle = '#ff9900';
      enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

      explosions.forEach(exp => exp.draw());

      document.getElementById('score').textContent = score;
      document.getElementById('lives').textContent = lives;
      document.getElementById('level').textContent = level;

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.9)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff0000';
        ctx.font = 'bold 60px Arial';
        ctx.fillText('GAME OVER', 180, 280);
        ctx.font = '30px Arial';
        ctx.fillStyle = 'white';
        ctx.fillText(`Pontuação: ${score}`, 260, 350);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function restartGame() {
      score = 0; lives = 3; level = 1; gameOver = false;
      bullets = []; enemies = []; explosions = []; enemyBullets = [];
      player.x = 350; player.y = 400;
    }

    gameLoop();
  </script>
</body>
</html>
