<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATALHA NO MAR 4D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #000814;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .container { text-align: center; }
    h1 {
      font-size: 3.4rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #00ffff, #00ff88, #00ffff);
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px #00ffff;
    }
    .game-info {
      font-size: 1.6rem;
      margin-bottom: 15px;
      display: flex;
      justify-content: center;
      gap: 50px;
    }
    canvas {
      border: 6px solid #00bfff;
      border-radius: 18px;
      box-shadow: 0 0 50px rgba(0, 191, 255, 0.7);
      background: #000d1f;
    }
    .controls {
      margin-top: 15px;
      font-size: 1.2rem;
      opacity: 0.85;
    }
    button {
      margin-top: 18px;
      padding: 16px 45px;
      font-size: 1.4rem;
      background: linear-gradient(#ff3366, #cc1122);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(255, 50, 80, 0.6);
      transition: 0.3s;
    }
    button:hover {
      transform: scale(1.08);
      box-shadow: 0 15px 30px rgba(255, 80, 100, 0.7);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚓ BATALHA NO MAR 4D ⚓</h1>
    <div class="game-info">
      <span>Pontos: <strong id="score">0</strong></span>
      <span>Vidas: <strong id="lives">3</strong></span>
      <span>Nível: <strong id="level">1</strong></span>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <p class="controls">← → Mover  |  ESPAÇO ou Clique = Atirar</p>
    <button onclick="restartGame()">Novo Jogo</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    let score = 0;
    let lives = 3;
    let level = 1;
    let gameOver = false;

    const player = { x: 365, y: 480, width: 70, height: 65, speed: 9 };

    let bullets = [];
    let enemies = [];
    let explosions = [];
    let enemyBullets = [];
    let keys = {};

    // Controles
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);
    canvas.addEventListener('click', shoot);
    window.addEventListener('keypress', e => { if (e.key === ' ') shoot(); });

    function shoot() {
      if (gameOver) return;
      bullets.push({
        x: player.x + 31,
        y: player.y - 5,
        width: 8,
        height: 28,
        speed: 15
      });
    }

    class Explosion {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = 15;
        this.life = 28;
      }
      update() { this.life -= 1; this.size += 1.8; }
      draw() {
        const alpha = this.life / 28;
        ctx.fillStyle = `rgba(255, ${this.life * 12}, 0, ${alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function createEnemy() {
      const isBig = Math.random() < 0.35;
      enemies.push({
        x: Math.random() * (canvas.width - 80),
        y: -80,
        width: isBig ? 85 : 65,
        height: isBig ? 65 : 55,
        speed: 1.6 + level * 0.45,
        type: isBig ? 'big' : 'normal'
      });
    }

    function drawOcean() {
      ctx.fillStyle = '#000d22';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(0, 200, 255, 0.3)';
      ctx.lineWidth = 5;
      for (let i = 0; i < 9; i++) {
        ctx.beginPath();
        const baseY = 60 + i * 58;
        ctx.moveTo(0, baseY);
        for (let x = 0; x < canvas.width; x += 22) {
          ctx.lineTo(x, baseY + Math.sin(x / 45 + Date.now() / 280) * 22);
        }
        ctx.stroke();
      }
    }

    function drawPlayer() {
      ctx.fillStyle = '#00ffbb';
      ctx.fillRect(player.x + 8, player.y + 15, 54, 42);
      ctx.fillStyle = '#00dd99';
      ctx.fillRect(player.x + 22, player.y + 5, 26, 28);
      ctx.fillStyle = '#ff2244';
      ctx.fillRect(player.x + 30, player.y - 12, 12, 22);
    }

    function update() {
      if (gameOver) return;

      if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed;
      if (keys['ArrowRight'] && player.x < canvas.width - player.width) player.x += player.speed;

      bullets = bullets.filter(b => { b.y -= b.speed; return b.y > -30; });

      enemies.forEach((e, i) => {
        e.y += e.speed;

        if (Math.random() < 0.028 + level * 0.006) {
          enemyBullets.push({
            x: e.x + e.width/2 - 3,
            y: e.y + e.height - 5,
            width: 8,
            height: 24,
            speed: 7.5
          });
        }

        if (e.y + e.height > player.y && 
            e.x < player.x + player.width && 
            e.x + e.width > player.x) {
          lives--;
          explosions.push(new Explosion(player.x + 35, player.y + 35));
          enemies.splice(i, 1);
          if (lives <= 0) gameOver = true;
        }
      });

      enemyBullets = enemyBullets.filter(b => { b.y += b.speed; return b.y < canvas.height; });

      bullets.forEach((b, bi) => {
        enemies.forEach((e, ei) => {
          if (b.x > e.x && b.x < e.x + e.width && b.y > e.y && b.y < e.y + e.height) {
            bullets.splice(bi, 1);
            explosions.push(new Explosion(e.x + e.width/2, e.y + e.height/2));
            enemies.splice(ei, 1);
            score += e.type === 'big' ? 250 : 100;
          }
        });
      });

      explosions = explosions.filter(exp => { exp.update(); return exp.life > 0; });

      if (score > level * 900) level++;

      if (Math.random() < 0.045 + level * 0.01) createEnemy();
    }

    function draw() {
      drawOcean();
      drawPlayer();

      ctx.fillStyle = '#ffff00';
      bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

      enemies.forEach(e => {
        ctx.fillStyle = e.type === 'big' ? '#ff3366' : '#ff5555';
        ctx.fillRect(e.x, e.y, e.width, e.height);
        ctx.fillStyle = '#ffee00';
        ctx.fillRect(e.x + e.width/2 - 8, e.y + 15, 16, 14);
      });

      ctx.fillStyle = '#ff8800';
      enemyBullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

      explosions.forEach(exp => exp.draw());

      document.getElementById('score').textContent = score;
      document.getElementById('lives').textContent = lives;
      document.getElementById('level').textContent = level;

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff0000';
        ctx.font = 'bold 58px Arial';
        ctx.fillText('GAME OVER', 195, 270);
        ctx.font = '32px Arial';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`Pontuação Final: ${score}`, 220, 340);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function restartGame() {
      score = 0;
      lives = 3;
      level = 1;
      gameOver = false;
      bullets = [];
      enemies = [];
      enemyBullets = [];
      explosions = [];
      player.x = 365;
    }

    gameLoop();
  </script>
</body>
</html>
