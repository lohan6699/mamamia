<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mario Pixel Art - Animado</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(#5C94FC, #A0C4FF);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #game {
      border: 8px solid #000;
      border-radius: 8px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.7);
      image-rendering: pixelated;
    }

    #score {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="score">Pontos: <span id="points">00000</span></div>
  <canvas id="game" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('points');

    let score = 0;
    let gameOver = false;
    let frame = 0;

    const mario = {
      x: 80,
      y: 250,
      width: 48,
      height: 48,
      speed: 6,
      jump: -18,
      velocityY: 0,
      grounded: false,
      facingRight: true,
      animFrame: 0
    };

    const gravity = 0.85;
    const keys = {};

    const platforms = [
      {x: 0, y: 350, width: 800, height: 50},
      {x: 180, y: 280, width: 160, height: 20},
      {x: 420, y: 220, width: 140, height: 20},
      {x: 650, y: 170, width: 180, height: 20},
      {x: 80, y: 160, width: 110, height: 20},
    ];

    let coins = [
      {x: 240, y: 230, collected: false},
      {x: 480, y: 170, collected: false},
      {x: 710, y: 120, collected: false},
      {x: 130, y: 110, collected: false},
      {x: 380, y: 250, collected: false},
    ];

    let goombas = [
      {x: 380, y: 310, width: 40, height: 38, speed: -2, alive: true},
      {x: 620, y: 310, width: 40, height: 38, speed: 2, alive: true},
    ];

    // Nuvens
    const clouds = [
      {x: 100, y: 60},
      {x: 400, y: 40},
      {x: 650, y: 80},
    ];

    function drawCloud(x, y) {
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(x, y, 60, 20);
      ctx.fillRect(x+10, y-10, 40, 20);
    }

    function drawPixelMario() {
      ctx.save();
      if (!mario.facingRight) {
        ctx.translate(mario.x + mario.width, mario.y);
        ctx.scale(-1, 1);
      } else {
        ctx.translate(mario.x, mario.y);
      }

      const isJumping = !mario.grounded;
      const isRunning = (keys['ArrowRight'] || keys['d'] || keys['ArrowLeft'] || keys['a']) && mario.grounded;

      // Chapéu
      ctx.fillStyle = '#E4000F';
      ctx.fillRect(12, 8, 28, 10);
      ctx.fillRect(8, 14, 36, 8);

      // Rosto
      ctx.fillStyle = '#FFDBB4';
      ctx.fillRect(16, 18, 20, 14);

      // Olhos
      ctx.fillStyle = '#000000';
      ctx.fillRect(22, 22, 5, 6);
      ctx.fillRect(30, 22, 5, 6);

      // Bigode
      ctx.fillRect(17, 30, 18, 4);

      // Corpo
      ctx.fillStyle = '#E4000F';
      ctx.fillRect(12, 34, 28, 18);

      // Macacão
      ctx.fillStyle = '#0040A0';
      ctx.fillRect(14, 44, 24, 10);

      // Botões
      ctx.fillStyle = '#FFD700';
      ctx.fillRect(18, 46, 4, 4);
      ctx.fillRect(30, 46, 4, 4);

      ctx.restore();
    }

    function drawPlatforms() {
      ctx.fillStyle = '#0B6623';
      platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.width, p.height);
        ctx.fillStyle = '#0F8B2E';
        ctx.fillRect(p.x, p.y, p.width, 6);
        ctx.fillStyle = '#0B6623';
      });
    }

    function drawPixelCoin(x, y) {
      ctx.fillStyle = '#FFD700';
      ctx.fillRect(x+4, y+4, 16, 16);
      ctx.fillStyle = '#B8860B';
      ctx.fillRect(x+7, y+8, 10, 4);
    }

    function drawCoins() {
      coins.forEach(coin => {
        if (!coin.collected) drawPixelCoin(coin.x, coin.y);
      });
    }

    function drawPixelGoomba(g) {
      if (!g.alive) return;
      ctx.fillStyle = '#8B4513';
      ctx.fillRect(g.x, g.y, g.width, g.height);
      
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(g.x + 8, g.y + 10, 8, 10);
      ctx.fillRect(g.x + 24, g.y + 10, 8, 10);
      
      ctx.fillStyle = '#000000';
      ctx.fillRect(g.x + 10, g.y + 13, 4, 5);
      ctx.fillRect(g.x + 26, g.y + 13, 4, 5);
    }

    function update() {
      if (gameOver) return;
      frame++;

      // Movimento
      if (keys['ArrowRight'] || keys['d']) {
        mario.x += mario.speed;
        mario.facingRight = true;
      }
      if (keys['ArrowLeft'] || keys['a']) {
        mario.x -= mario.speed;
        mario.facingRight = false;
      }

      // Pulo
      if ((keys[' '] || keys['ArrowUp'] || keys['w']) && mario.grounded) {
        mario.velocityY = mario.jump;
        mario.grounded = false;
      }

      mario.velocityY += gravity;
      mario.y += mario.velocityY;

      // Colisão plataformas
      mario.grounded = false;
      for (let p of platforms) {
        if (
          mario.x < p.x + p.width && mario.x + mario.width > p.x &&
          mario.y < p.y + p.height && mario.y + mario.height > p.y
        ) {
          if (mario.velocityY > 0) {
            mario.y = p.y - mario.height;
            mario.velocityY = 0;
            mario.grounded = true;
          }
        }
      }

      // Moedas
      coins.forEach(coin => {
        if (!coin.collected && 
            mario.x < coin.x + 24 && mario.x + mario.width > coin.x &&
            mario.y < coin.y + 24 && mario.y + mario.height > coin.y) {
          coin.collected = true;
          score += 100;
          scoreElement.textContent = String(score).padStart(5, '0');
        }
      });

      // Goombas
      goombas.forEach(g => {
        if (!g.alive) return;
        g.x += g.speed;

        if (mario.x < g.x + g.width && mario.x + mario.width > g.x &&
            mario.y < g.y + g.height && mario.y + mario.height > g.y) {
          
          if (mario.velocityY > 0 && mario.y + mario.height - 20 < g.y) {
            g.alive = false;
            mario.velocityY = -13;
            score += 200;
            scoreElement.textContent = String(score).padStart(5, '0');
          } else {
            gameOver = true;
            alert('💀 Game Over!\nPontos: ' + score);
          }
        }

        if (g.x <= 0 || g.x + g.width >= canvas.width) g.speed *= -1;
      });

      // Limites
      if (mario.x < 0) mario.x = 0;
      if (mario.x + mario.width > canvas.width) mario.x = canvas.width - mario.width;
      if (mario.y > canvas.height) {
        gameOver = true;
        alert('💀 Game Over!\nPontos: ' + score);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Nuvens
      clouds.forEach(c => drawCloud(c.x, c.y));

      drawPlatforms();
      drawCoins();
      goombas.forEach(drawPixelGoomba);
      drawPixelMario();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    gameLoop();
  </script>

  <p style="position:absolute;bottom:15px;color:white;text-align:center;width:100%;font-size:14px;">
    ← → ou A D : mover | ESPAÇO : pular | Pule nos Goombas!
  </p>
</body>
</html>
