<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudante Pixel - Aventura</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(#5C94FC, #A0C4FF);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #game {
      border: 8px solid #000;
      border-radius: 8px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.7);
      image-rendering: pixelated;
    }

    #score {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="score">Pontos: <span id="points">00000</span></div>
  <canvas id="game" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('points');

    let score = 0;
    let gameOver = false;
    let frame = 0;

    const estudante = {
      x: 80,
      y: 250,
      width: 48,
      height: 48,
      speed: 6,
      jump: -18,
      velocityY: 0,
      grounded: false,
      facingRight: true,
      isMoving: false
    };

    const gravity = 0.85;
    const keys = {};

    const platforms = [
      {x: 0, y: 350, width: 800, height: 50},
      {x: 180, y: 280, width: 160, height: 20},
      {x: 420, y: 220, width: 140, height: 20},
      {x: 650, y: 170, width: 180, height: 20},
      {x: 80, y: 160, width: 110, height: 20},
    ];

    let coins = [
      {x: 240, y: 230, collected: false},
      {x: 480, y: 170, collected: false},
      {x: 710, y: 120, collected: false},
      {x: 130, y: 110, collected: false},
      {x: 380, y: 250, collected: false},
    ];

    let goombas = [
      {x: 380, y: 310, width: 40, height: 38, speed: -2, alive: true},
      {x: 620, y: 310, width: 40, height: 38, speed: 2, alive: true},
    ];

    const clouds = [
      {x: 100, y: 60},
      {x: 400, y: 40},
      {x: 650, y: 80},
    ];

    function drawCloud(x, y) {
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(x, y, 60, 20);
      ctx.fillRect(x+10, y-10, 40, 20);
    }

    function drawEstudante() {
      ctx.save();
      if (!estudante.facingRight) {
        ctx.translate(estudante.x + estudante.width, estudante.y);
        ctx.scale(-1, 1);
      } else {
        ctx.translate(estudante.x, estudante.y);
      }

      const isJumping = !estudante.grounded;
      const isRunning = estudante.isMoving && estudante.grounded;

      // === CABEÇA + CABELO ===
      ctx.fillStyle = '#2C2C2C';           // Cabelo preto
      ctx.fillRect(14, 10, 24, 12);
      
      // Rosto
      ctx.fillStyle = '#FFDBB4';
      ctx.fillRect(16, 16, 20, 16);

      // === ÓCULOS ===
      ctx.fillStyle = '#000000';
      ctx.fillRect(19, 20, 7, 6);
      ctx.fillRect(28, 20, 7, 6);
      ctx.fillRect(26, 22, 2, 2);

      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(21, 21, 3, 3);
      ctx.fillRect(30, 21, 3, 3);

      // === CAMISA SOCIAL (branca) ===
      ctx.fillStyle = '#F0F0F0';
      ctx.fillRect(14, 32, 26, 18);

      // Gravata ou detalhe
      ctx.fillStyle = '#0040A0';
      ctx.fillRect(22, 34, 8, 10);

      // === MOCHILA ===
      ctx.fillStyle = '#8B4513';
      ctx.fillRect(36, 34, 10, 16);
      ctx.fillStyle = '#654321';
      ctx.fillRect(37, 36, 8, 12);
      ctx.fillRect(32, 34, 4, 14); // alça

      // === CALÇA ===
      ctx.fillStyle = '#1E3A8A';           // Azul escuro (calça jeans)
      ctx.fillRect(16, 48, 24, 10);

      // === SAPATOS ===
      ctx.fillStyle = '#111111';
      ctx.fillRect(16, 56, 8, 6);
      ctx.fillRect(28, 56, 8, 6);

      ctx.restore();
    }

    function drawPlatforms() {
      ctx.fillStyle = '#0B6623';
      platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.width, p.height);
        ctx.fillStyle = '#0F8B2E';
        ctx.fillRect(p.x, p.y, p.width, 6);
        ctx.fillStyle = '#0B6623';
      });
    }

    function drawPixelCoin(x, y) {
      ctx.fillStyle = '#FFD700';
      ctx.fillRect(x+4, y+4, 16, 16);
      ctx.fillStyle = '#B8860B';
      ctx.fillRect(x+7, y+8, 10, 4);
    }

    function drawCoins() {
      coins.forEach(coin => {
        if (!coin.collected) drawPixelCoin(coin.x, coin.y);
      });
    }

    function drawPixelGoomba(g) {
      if (!g.alive) return;
      ctx.fillStyle = '#8B4513';
      ctx.fillRect(g.x, g.y, g.width, g.height);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(g.x + 8, g.y + 10, 8, 10);
      ctx.fillRect(g.x + 24, g.y + 10, 8, 10);
      ctx.fillStyle = '#000000';
      ctx.fillRect(g.x + 10, g.y + 13, 4, 5);
      ctx.fillRect(g.x + 26, g.y + 13, 4, 5);
    }

    function update() {
      if (gameOver) return;
      frame++;

      estudante.isMoving = false;

      if (keys['ArrowRight'] || keys['d']) {
        estudante.x += estudante.speed;
        estudante.facingRight = true;
        estudante.isMoving = true;
      }
      if (keys['ArrowLeft'] || keys['a']) {
        estudante.x -= estudante.speed;
        estudante.facingRight = false;
        estudante.isMoving = true;
      }

      if ((keys[' '] || keys['ArrowUp'] || keys['w']) && estudante.grounded) {
        estudante.velocityY = estudante.jump;
        estudante.grounded = false;
      }

      estudante.velocityY += gravity;
      estudante.y += estudante.velocityY;

      estudante.grounded = false;
      for (let p of platforms) {
        if (
          estudante.x < p.x + p.width && estudante.x + estudante.width > p.x &&
          estudante.y < p.y + p.height && estudante.y + estudante.height > p.y
        ) {
          if (estudante.velocityY > 0) {
            estudante.y = p.y - estudante.height;
            estudante.velocityY = 0;
            estudante.grounded = true;
          }
        }
      }

      // Moedas e Goombas (igual antes)
      coins.forEach(coin => {
        if (!coin.collected && 
            estudante.x < coin.x + 24 && estudante.x + estudante.width > coin.x &&
            estudante.y < coin.y + 24 && estudante.y + estudante.height > coin.y) {
          coin.collected = true;
          score += 100;
          scoreElement.textContent = String(score).padStart(5, '0');
        }
      });

      goombas.forEach(g => {
        if (!g.alive) return;
        g.x += g.speed;

        if (estudante.x < g.x + g.width && estudante.x + estudante.width > g.x &&
            estudante.y < g.y + g.height && estudante.y + estudante.height > g.y) {
          
          if (estudante.velocityY > 0 && estudante.y + estudante.height - 20 < g.y) {
            g.alive = false;
            estudante.velocityY = -13;
            score += 200;
            scoreElement.textContent = String(score).padStart(5, '0');
          } else {
            gameOver = true;
            alert('💀 Game Over!\nPontos: ' + score);
          }
        }

        if (g.x <= 0 || g.x + g.width >= canvas.width) g.speed *= -1;
      });

      if (estudante.x < 0) estudante.x = 0;
      if (estudante.x + estudante.width > canvas.width) estudante.x = canvas.width - estudante.width;
      if (estudante.y > canvas.height) {
        gameOver = true;
        alert('💀 Game Over!\nPontos: ' + score);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      clouds.forEach(c => drawCloud(c.x, c.y));
      drawPlatforms();
      drawCoins();
      goombas.forEach(drawPixelGoomba);
      drawEstudante();
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    gameLoop();
  </script>

  <p style="position:absolute;bottom:15px;color:white;text-align:center;width:100%;font-size:14px;">
    ← → ou A D : mover | ESPAÇO : pular | Pule nos Goombas!
  </p>
</body>
</html>
