<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudante Aventureiro - vs Matemática</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #000;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    #game {
      border: 8px solid #222;
      box-shadow: 0 0 40px rgba(0,0,0,0.9);
      image-rendering: pixelated;
    }

    #menu {
      position: absolute;
      color: white;
      text-align: center;
      width: 800px;
      z-index: 100;
    }

    h1 { font-size: 48px; color: #00FF00; text-shadow: 4px 4px 0 #000; }
    button {
      font-size: 26px;
      padding: 15px 50px;
      margin: 15px;
      background: #0066FF;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="menu">
    <h1>ESTUDANTE AVENTUREIRO</h1>
    <p>Derrote o Boss <strong>MATEMÁTICA</strong>!</p>
    <p style="font-size:18px;">← → Mover | ESPAÇO Pular | J Atirar Livro</p>
    <button onclick="startGame()">INICIAR JOGO</button>
  </div>

  <canvas id="game" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const menu = document.getElementById('menu');

    let score = 0;
    let gameState = 'MENU';
    let cameraX = 0;
    const WORLD_WIDTH = 1800;

    const estudante = {
      x: 100, y: 250, width: 48, height: 48,
      speed: 6, jump: -18, velocityY: 0,
      grounded: false, facingRight: true
    };

    const gravity = 0.85;
    const keys = {};

    let platforms = [], coins = [], goombas = [];
    let boss = null;
    let projectiles = [];     // Projéteis do jogador
    let enemyProjectiles = []; // Projéteis do boss

    function loadLevel() {
      score = 0;
      estudante.x = 100;
      cameraX = 0;
      projectiles = [];
      enemyProjectiles = [];

      platforms = [
        {x: 0, y: 350, width: WORLD_WIDTH, height: 50},
        {x: 250, y: 280, width: 180, height: 20},
        {x: 550, y: 210, width: 140, height: 20},
        {x: 850, y: 260, width: 200, height: 20},
        {x: 1150, y: 180, width: 150, height: 20},
        {x: 1450, y: 240, width: 120, height: 20},
      ];

      coins = [ /* moedas */ ];

      goombas = [ /* goombas */ ];

      boss = {
        x: 1550, y: 160, width: 80, height: 90,
        health: 10, maxHealth: 10,
        shootTimer: 0
      };
    }

    function startGame() {
      loadLevel();
      menu.style.display = 'none';
      gameState = 'PLAYING';
    }

    function drawBackground() {
      ctx.fillStyle = '#5C94FC';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // nuvens...
    }

    function drawEstudante() {
      ctx.save();
      if (!estudante.facingRight) {
        ctx.translate(estudante.x - cameraX + estudante.width, estudante.y);
        ctx.scale(-1, 1);
      } else {
        ctx.translate(estudante.x - cameraX, estudante.y);
      }

      // Corpo do estudante (mesmo anterior)
      ctx.fillStyle = '#2C2C2C'; ctx.fillRect(14, 10, 24, 12);
      ctx.fillStyle = '#FFDBB4'; ctx.fillRect(16, 16, 20, 16);
      ctx.fillStyle = '#000'; ctx.fillRect(19,20,7,6); ctx.fillRect(28,20,7,6);
      ctx.fillStyle = '#FFF'; ctx.fillRect(21,21,3,3); ctx.fillRect(30,21,3,3);
      ctx.fillStyle = '#F0F0F0'; ctx.fillRect(14,32,26,18);
      ctx.fillStyle = '#C8102E'; ctx.fillRect(22,34,8,12);

      // Mochila
      ctx.fillStyle = '#8B4513'; ctx.fillRect(36,34,10,16);

      // Calça e sapatos
      ctx.fillStyle = '#1E3A8A'; ctx.fillRect(16,48,24,10);
      ctx.fillStyle = '#111'; ctx.fillRect(16,56,9,6); ctx.fillRect(27,56,9,6);

      // === ARMA (Livro) ===
      ctx.fillStyle = '#8B4513';
      ctx.fillRect(38, 38, 12, 10);   // livro na mão

      ctx.restore();
    }

    function drawBoss() {
      if (!boss || boss.health <= 0) return;
      ctx.fillStyle = '#8B0000';
      ctx.fillRect(boss.x - cameraX, boss.y, boss.width, boss.height);
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 28px Arial';
      ctx.fillText('📐', boss.x - cameraX + 22, boss.y + 55);
      ctx.fillStyle = '#FFF';
      ctx.font = 'bold 14px Arial';
      ctx.fillText('MATEMÁTICA', boss.x - cameraX + 5, boss.y - 8);
    }

    function drawHealthBar() {
      if (!boss || boss.health <= 0) return;
      const barWidth = 220;
      const percent = boss.health / boss.maxHealth;
      ctx.fillStyle = '#000';
      ctx.fillRect(290, 25, barWidth, 22);
      ctx.fillStyle = percent > 0.4 ? '#00FF00' : '#FF0000';
      ctx.fillRect(290, 25, barWidth * percent, 22);
      ctx.fillStyle = '#FFF';
      ctx.font = '18px Arial';
      ctx.fillText('BOSS MATEMÁTICA', 300, 20);
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      // Movimento
      if (keys['ArrowRight'] || keys['d']) estudante.x += estudante.speed, estudante.facingRight = true;
      if (keys['ArrowLeft'] || keys['a']) estudante.x -= estudante.speed, estudante.facingRight = false;

      if ((keys[' '] || keys['ArrowUp'] || keys['w']) && estudante.grounded) {
        estudante.velocityY = estudante.jump;
        estudante.grounded = false;
      }

      estudante.velocityY += gravity;
      estudante.y += estudante.velocityY;

      // Colisão plataformas (simplificado)
      estudante.grounded = false;
      for (let p of platforms) {
        if (estudante.x < p.x + p.width && estudante.x + estudante.width > p.x &&
            estudante.y < p.y + p.height && estudante.y + estudante.height > p.y) {
          if (estudante.velocityY > 0) {
            estudante.y = p.y - estudante.height;
            estudante.velocityY = 0;
            estudante.grounded = true;
          }
        }
      }

      // Atirar com J
      if (keys['j'] || keys['J']) {
        if (!estudante.lastShot || Date.now() - estudante.lastShot > 300) {
          projectiles.push({
            x: estudante.facingRight ? estudante.x + 45 : estudante.x - 10,
            y: estudante.y + 25,
            width: 14,
            height: 12,
            speed: estudante.facingRight ? 9 : -9
          });
          estudante.lastShot = Date.now();
          delete keys['j']; delete keys['J']; // evita tiro contínuo
        }
      }

      // Atualiza projéteis do jogador
      for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.speed;

        // Colisão com Boss
        if (boss && boss.health > 0 &&
            p.x < boss.x + boss.width && p.x + p.width > boss.x &&
            p.y < boss.y + boss.height && p.y + p.height > boss.y) {
          boss.health--;
          projectiles.splice(i, 1);
          if (boss.health <= 0) {
            alert("🏆 VITÓRIA! Você derrotou MATEMÁTICA com seus livros!");
            menu.style.display = 'block';
            gameState = 'MENU';
          }
        }
      }

      // Lógica do Boss (atira equações)
      if (boss && boss.health > 0) {
        boss.shootTimer++;
        if (boss.shootTimer > 70) {
          enemyProjectiles.push({
            x: boss.x + 30,
            y: boss.y + 40,
            width: 18,
            height: 18,
            speed: -4
          });
          boss.shootTimer = 0;
        }
      }

      // Atualiza projéteis inimigos
      for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
        let p = enemyProjectiles[i];
        p.x += p.speed;
        if (estudante.x < p.x && estudante.x + estudante.width > p.x &&
            estudante.y < p.y && estudante.y + estudante.height > p.y) {
          alert("Você foi atingido por uma equação difícil!");
          menu.style.display = 'block';
          gameState = 'MENU';
        }
      }

      // Câmera
      cameraX = Math.max(0, Math.min(estudante.x - 300, WORLD_WIDTH - canvas.width));
    }

    function draw() {
      drawBackground();
      // plataformas, moedas, goombas...
      drawBoss();
      drawHealthBar();
      drawEstudante();

      // Projéteis do jogador (livros)
      ctx.fillStyle = '#8B4513';
      projectiles.forEach(p => {
        ctx.fillRect(p.x - cameraX, p.y, p.width, p.height);
      });

      // Projéteis do boss (equações)
      ctx.fillStyle = '#FFFF00';
      enemyProjectiles.forEach(p => {
        ctx.fillRect(p.x - cameraX, p.y, p.width, p.height);
      });
    }

    function gameLoop() {
      update();
      if (gameState === 'PLAYING') draw();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    gameLoop();
  </script>
</body>
</html>
