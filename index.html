<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sobrevivência na Amazônia</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');
  :root {
    --verde-escuro: #0a1f0a; --verde-meio: #1a3d1a; --verde-claro: #2d6e2d;
    --verde-brilho: #4caf50; --verde-neon: #00ff88; --marrom: #5c3d1e;
    --dourado: #c9a227; --vermelho-perigo: #cc2200; --preto: #050d05;
    --branco-suave: #e8f5e0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--preto); color: var(--branco-suave); font-family: 'Crimson Text', Georgia, serif; overflow: hidden; height: 100vh; width: 100vw; }
  #tela-titulo { position: fixed; inset: 0; background: radial-gradient(ellipse at center, #0a2a0a 0%, #020a02 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
  .titulo-principal { font-family: 'Cinzel', serif; font-size: clamp(2rem, 6vw, 5rem); font-weight: 900; color: var(--verde-neon); text-shadow: 0 0 30px #00ff8866; letter-spacing: 4px; animation: pulsar 3s ease-in-out infinite; }
  .subtitulo { font-family: 'Cinzel', serif; font-size: clamp(0.8rem, 2.5vw, 1.4rem); color: var(--dourado); letter-spacing: 8px; margin-bottom: 3rem; }
  .btn-comecar { font-family: 'Cinzel', serif; font-size: 1.2rem; letter-spacing: 3px; padding: 14px 40px; background: transparent; border: 2px solid var(--verde-neon); color: var(--verde-neon); cursor: pointer; transition: all 0.3s; }
  .btn-comecar:hover { color: var(--preto); background: var(--verde-neon); }
  #jogo { display: none; width: 100vw; height: 100vh; position: relative; overflow: hidden; }
  #canvas-mundo { display: block; cursor: crosshair; }
  #hud { position: fixed; top: 0; left: 0; right: 0; padding: 10px 16px; display: flex; justify-content: space-between; background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%); z-index: 50; pointer-events: none; }
  .painel-stats { display: flex; flex-direction: column; gap: 6px; pointer-events: all; }
  .barra-stat { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; }
  .barra-bg { width: 120px; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
  .barra-fill { height: 100%; transition: width 0.5s; }
  .fill-vida { background: linear-gradient(90deg, #cc2200, #ff5533); }
  .fill-fome { background: linear-gradient(90deg, #8b4513, #d2691e); }
  .fill-sede { background: linear-gradient(90deg, #0066cc, #33aaff); }
  .fill-energia { background: linear-gradient(90deg, #d4a017, #f0c94a); }
  #painel-info { text-align: right; pointer-events: all; }
  #log-eventos { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px 16px; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 100%); z-index: 50; }
  .btn-acao { font-family: 'Cinzel', serif; font-size: 0.7rem; padding: 6px 14px; background: rgba(0,0,0,0.7); border: 1px solid var(--verde-claro); color: var(--branco-suave); cursor: pointer; margin: 2px; }
  .btn-acao:hover { background: var(--verde-claro); color: black; }
  #modal-lenda { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; align-items: center; justify-content: center; }
  #modal-lenda.aberto { display: flex; }
  .caixa-lenda { max-width: 520px; background: #0a1f0a; border: 2px solid #c9a227; padding: 2rem; text-align: center; }
  #tela-fim { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 400; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; }
  #tela-fim.aberto { display: flex; }
  @keyframes pulsar { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
</style>
</head>
<body>

<div id="tela-titulo">
  <div class="titulo-principal">AMAZÔNIA</div>
  <div class="subtitulo">SOBREVIVÊNCIA • LENDAS • MISTÉRIO</div>
  <p style="max-width:420px; text-align:center; margin:1.5rem 0; line-height:1.6;">
    Use <strong>WASD</strong> ou <strong>SETAS</strong><br>
    <strong>Controles de videogame</strong> também funcionam!
  </p>
  <button class="btn-comecar" onclick="iniciarJogo()">ENTRAR NA FLORESTA</button>
</div>

<div id="hud" style="display:none;">
  <div class="painel-stats">
    <div class="barra-stat"><span>❤ VIDA</span><div class="barra-bg"><div class="barra-fill fill-vida" id="b-vida" style="width:100%"></div></div><span id="v-vida">100</span></div>
    <div class="barra-stat"><span>🍗 FOME</span><div class="barra-bg"><div class="barra-fill fill-fome" id="b-fome" style="width:100%"></div></div><span id="v-fome">100</span></div>
    <div class="barra-stat"><span>💧 SEDE</span><div class="barra-bg"><div class="barra-fill fill-sede" id="b-sede" style="width:100%"></div></div><span id="v-sede">100</span></div>
    <div class="barra-stat"><span>⚡ ENERGIA</span><div class="barra-bg"><div class="barra-fill fill-energia" id="b-energia" style="width:100%"></div></div><span id="v-energia">100</span></div>
  </div>
  <div id="painel-info">
    <div id="localizacao">Floresta Densa</div>
    <div id="hora-dia">☀ Dia 1 — Manhã</div>
  </div>
</div>

<div id="jogo"><canvas id="canvas-mundo"></canvas></div>

<div id="log-eventos" style="display:none;">
  <div id="mensagem-atual">A floresta espera por você...</div>
  <div id="acoes"></div>
</div>

<div id="modal-lenda">
  <div class="caixa-lenda">
    <span id="lenda-emoji" style="font-size:4rem;display:block;margin-bottom:10px;"></span>
    <h2 id="lenda-nome" style="color:#f0c94a;"></h2>
    <p id="lenda-tipo" style="color:#00ff88; margin-bottom:15px;"></p>
    <p id="lenda-texto"></p>
    <p id="lenda-dica" style="color:#c9a227; font-style:italic; margin-top:15px;"></p>
    <button onclick="fecharLenda()" style="margin-top:20px; padding:10px 25px;">Continuar</button>
  </div>
</div>

<div id="tela-fim">
  <h1 id="fim-titulo" style="color:#cc2200;">A FLORESTA VENCEU</h1>
  <p id="fim-subtitulo"></p>
  <button class="btn-comecar" onclick="reiniciar()">TENTAR NOVAMENTE</button>
</div>

<script>
// ==================== DADOS DO JOGO ====================
const LENDAS = [ /* ... mesmo array original ... */ 
  { nome:"Curupira", tipo:"Guardião da Floresta", emoji:"🦶", texto:"O Curupira é o protetor das matas...", dica:"Observe o musgo nas árvores — sempre cresce no lado norte.", efeito:"confusao" },
  { nome:"Mapinguari", tipo:"Besta Ancestral", emoji:"🦁", texto:"Uma criatura colossal...", dica:"Não corra. Fique imóvel.", efeito:"medo" },
  { nome:"Iara", tipo:"Sereia dos Rios", emoji:"🧜‍♀️", texto:"A rainha das águas...", dica:"Tampe os ouvidos ao se aproximar de rios à noite.", efeito:"atracaoAgua" },
  { nome:"Boto Cor-de-Rosa", tipo:"Espírito Sedutor", emoji:"🐬", texto:"Nas noites de festa...", dica:"Ver o boto é sinal de boa sorte.", efeito:"sorte" },
  { nome:"Matinta Perera", tipo:"Feiticeira Noturna", emoji:"🦉", texto:"Um assobio agudo...", dica:"Não responda ao assobio.", efeito:"susto" },
  { nome:"Anhangá", tipo:"Espírito dos Animais", emoji:"🦌", texto:"Aparece como um cervo branco...", dica:"Cace apenas o necessário.", efeito:"aviso" }
];

const TILE = 48, MAPA_W = 60, MAPA_H = 60;
const T = {FLORESTA:0, AGUA:1, CLAREIRA:2, PEDRA:3, BAMBU:4, FRUTAS:5, ABRIGO:6, FOGO:7};

const corT = {"0":"#1a3d1a","1":"#0a4f7a","2":"#3d5c1a","3":"#555555","4":"#2d5c2d","5":"#2d5c1a","6":"#5c3d1e","7":"#cc4400"};

let estado = {}, mapa = [], entidades = [], itens = [], teclas = {};
let tempoDecorrido = 0, diaNumero = 1, periodoDia = 1, ultimoTimestamp = 0;
let legendasVistas = new Set();
let gamepadIndex = -1;

const periodos = ['Madrugada','Manhã','Tarde','Entardecer','Noite'];

// ==================== SUPORTE A CONTROLE ====================
window.addEventListener("gamepadconnected", (e) => {
  gamepadIndex = e.gamepad.index;
  mostrarMensagem("🎮 Controle detectado! Use o analógico esquerdo.");
});

window.addEventListener("gamepaddisconnected", () => {
  gamepadIndex = -1;
  mostrarMensagem("🎮 Controle desconectado.");
});

// ==================== GERAR MAPA (Minecraft Style) ====================
function gerarMapa() {
  mapa = [];
  for(let y = 0; y < MAPA_H; y++) {
    mapa[y] = [];
    for(let x = 0; x < MAPA_W; x++) {
      let r = Math.random();
      let tipo = (r < 0.52) ? T.FLORESTA : 
                 (r < 0.62) ? T.BAMBU :
                 (r < 0.70) ? T.CLAREIRA :
                 (r < 0.78) ? T.AGUA : T.FLORESTA;
      
      mapa[y][x] = { tipo: tipo, altura: Math.random()*0.5 + 0.8, v: Math.random() };
    }
  }
  // Rios
  for(let i = 0; i < 5; i++) {
    let x = 10 + Math.floor(Math.random()*(MAPA_W-20));
    let y = 10 + Math.floor(Math.random()*(MAPA_H-20));
    for(let j = 0; j < 15; j++) {
      if(x >= 0 && x < MAPA_W && y >= 0 && y < MAPA_H) mapa[y][x].tipo = T.AGUA;
      x += Math.random() > 0.5 ? 1 : 0;
      y += Math.random() > 0.5 ? 1 : (Math.random() > 0.5 ? -1 : 0);
    }
  }
}

// ==================== MOVIMENTO (Teclado + Controle) ====================
function moverJogador(dt) {
  if(estado.energia <= 0) return;
  let dx = 0, dy = 0;
  const vel = 5.2 * dt * (estado.energia > 25 ? 1 : 0.55);

  // Teclado
  if(teclas['KeyA'] || teclas['ArrowLeft']) dx -= vel;
  if(teclas['KeyD'] || teclas['ArrowRight']) dx += vel;
  if(teclas['KeyW'] || teclas['ArrowUp']) dy -= vel;
  if(teclas['KeyS'] || teclas['ArrowDown']) dy += vel;

  // Controle de Videogame
  if(gamepadIndex !== -1) {
    const gp = navigator.getGamepads()[gamepadIndex];
    if(gp) {
      dx += gp.axes[0] * vel * 1.4;
      dy += gp.axes[1] * vel * 1.4;
    }
  }

  if(dx !== 0 || dy !== 0) {
    let nx = Math.max(1, Math.min(MAPA_W-2, estado.x + dx));
    let ny = Math.max(1, Math.min(MAPA_H-2, estado.y + dy));
    
    const tile = mapa[Math.floor(ny)]?.[Math.floor(nx)];
    if(tile && tile.tipo !== T.PEDRA) {
      estado.x = nx;
      estado.y = ny;
    }
  }
}

// ==================== RENDERIZAÇÃO MINECRAFT ====================
function renderizar() {
  const canvas = document.getElementById('canvas-mundo');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const camX = estado.x * TILE - W/2;
  const camY = estado.y * TILE - H/2;
  const noite = (periodoDia === 0 || periodoDia === 4);

  ctx.fillStyle = noite ? '#0a0a1f' : '#050d05';
  ctx.fillRect(0, 0, W, H);

  const tx0 = Math.max(0, Math.floor(camX/TILE));
  const ty0 = Math.max(0, Math.floor(camY/TILE));
  const tx1 = Math.min(MAPA_W-1, Math.ceil((camX + W)/TILE));
  const ty1 = Math.min(MAPA_H-1, Math.ceil((camY + H)/TILE));

  for(let ty = ty0; ty <= ty1; ty++) {
    for(let tx = tx0; tx <= tx1; tx++) {
      const tile = mapa[ty][tx];
      const sx = tx * TILE - camX;
      const sy = ty * TILE - camY;
      const alt = tile.altura * 8;

      ctx.fillStyle = '#111';
      ctx.fillRect(sx + 3, sy + 3, TILE, TILE); // sombra

      ctx.fillStyle = corT[tile.tipo];
      ctx.fillRect(sx, sy - alt, TILE, TILE + alt);

      if(tile.tipo === T.FLORESTA) {
        ctx.fillStyle = '#2d6e2d';
        ctx.fillRect(sx+8, sy-alt-12, TILE-16, 18);
      }
      if(tile.tipo === T.AGUA) {
        ctx.fillStyle = 'rgba(10,90,160,0.9)';
        ctx.fillRect(sx, sy-8, TILE, TILE+12);
      }
      if(tile.tipo === T.FOGO) ctx.fillText('🔥', sx + TILE/2 - 10, sy + TILE/2 + 5);
    }
  }

  // Itens e Entidades (simplificado)
  itens.forEach(i => {
    const sx = i.x * TILE - camX;
    const sy = i.y * TILE - camY;
    ctx.font = '22px serif';
    ctx.fillText(i.emoji, sx, sy);
  });

  entidades.forEach(e => {
    const sx = e.x * TILE - camX;
    const sy = e.y * TILE - camY;
    ctx.font = '32px serif';
    ctx.fillText(LENDAS[e.lenda].emoji, sx, sy);
  });

  // Jogador
  ctx.fillStyle = '#00ff88';
  ctx.shadowBlur = 25;
  ctx.shadowColor = '#00ff88';
  ctx.beginPath();
  ctx.arc(W/2, H/2, 11, 0, Math.PI*2);
  ctx.fill();
}

// ==================== LOOP PRINCIPAL ====================
function loop(ts) {
  const dt = Math.min((ts - ultimoTimestamp)/1000, 0.1);
  ultimoTimestamp = ts;
  tempoDecorrido += dt;

  moverJogador(dt);
  renderizar();
  atualizarHUD();

  requestAnimationFrame(loop);
}

// Funções básicas (resumidas)
function iniciarJogo() {
  document.getElementById('tela-titulo').style.display = 'none';
  document.getElementById('jogo').style.display = 'block';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('log-eventos').style.display = 'block';

  const canvas = document.getElementById('canvas-mundo');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  gerarMapa();
  // gerarItens(), gerarEntidades() podem ser adicionados depois

  estado = {x: MAPA_W/2, y: MAPA_H/2, vida:100, fome:100, sede:100, energia:100, inventario:[], passos:0, lendas:[]};

  document.onkeydown = e => teclas[e.code] = true;
  document.onkeyup = e => teclas[e.code] = false;

  ultimoTimestamp = performance.now();
  mostrarMensagem("Bem-vindo à Amazônia! Use WASD ou controle.");
  requestAnimationFrame(loop);
}

function mostrarMensagem(txt) {
  document.getElementById('mensagem-atual').textContent = txt;
}

function atualizarHUD() {
  // Atualiza barras (simplificado)
  document.getElementById('b-vida').style.width = estado.vida + '%';
  document.getElementById('v-vida').textContent = Math.round(estado.vida);
  // ... repita para fome, sede e energia
}

function reiniciar() { location.reload(); }
function fecharLenda() { document.getElementById('modal-lenda').classList.remove('aberto'); }

// Iniciar
</script>
</body>
</html>
