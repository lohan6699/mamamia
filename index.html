<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batalha Naval</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>⚔️ Batalha Naval ⚔️</h1>
    
    <div class="game-area">
      <!-- Tabuleiro do Jogador -->
      <div class="board-container">
        <h2>Seus Navios</h2>
        <div class="board" id="player-board"></div>
      </div>

      <!-- Tabuleiro do Inimigo -->
      <div class="board-container">
        <h2>Tabuleiro Inimigo</h2>
        <div class="board" id="enemy-board"></div>
      </div>
    </div>

    <div class="status" id="status">Clique em uma célula do inimigo para atirar!</div>
    
    <button class="reset-btn" onclick="newGame()">Novo Jogo</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
