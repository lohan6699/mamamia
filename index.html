<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudante Aventureiro - vs Matemática</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #000;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    #game {
      border: 8px solid #222;
      box-shadow: 0 0 40px rgba(0,0,0,0.9);
      image-rendering: pixelated;
    }

    #menu {
      position: absolute;
      color: white;
      text-align: center;
      width: 800px;
      z-index: 100;
    }

    h1 { font-size: 48px; color: #00FF00; text-shadow: 4px 4px 0 #000; }
    button {
      font-size: 26px;
      padding: 15px 50px;
      margin: 15px;
      background: #0066FF;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="menu">
    <h1>ESTUDANTE AVENTUREIRO</h1>
    <p>Derrote o Boss <strong>MATEMÁTICA</strong>!</p>
    <button onclick="startGame()">INICIAR JOGO</button>
  </div>

  <canvas id="game" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const menu = document.getElementById('menu');

    let score = 0;
    let gameState = 'MENU';
    let cameraX = 0;
    const WORLD_WIDTH = 1800;

    const estudante = {
      x: 100, y: 250, width: 48, height: 48,
      speed: 6, jump: -18, velocityY: 0,
      grounded: false, facingRight: true
    };

    const gravity = 0.85;
    const keys = {};

    let platforms = [], coins = [], goombas = [];
    let boss = null;
    let projectiles = [];

    function loadLevel() {
      score = 0;
      estudante.x = 100;
      cameraX = 0;
      projectiles = [];

      platforms = [
        {x: 0, y: 350, width: WORLD_WIDTH, height: 50},
        {x: 250, y: 280, width: 180, height: 20},
        {x: 550, y: 210, width: 140, height: 20},
        {x: 850, y: 260, width: 200, height: 20},
        {x: 1150, y: 180, width: 150, height: 20},
        {x: 1450, y: 240, width: 120, height: 20},
      ];

      coins = [
        {x: 320, y: 220, collected: false},
        {x: 620, y: 150, collected: false},
        {x: 920, y: 200, collected: false},
        {x: 1220, y: 120, collected: false},
      ];

      goombas = [
        {x: 450, y: 310, width: 40, height: 38, speed: -2, alive: true},
        {x: 780, y: 310, width: 40, height: 38, speed: 2, alive: true},
      ];

      // Boss Matemática
      boss = {
        x: 1550,
        y: 180,
        width: 80,
        height: 80,
        health: 8,
        maxHealth: 8,
        speed: 1.5,
        direction: -1,
        shootTimer: 0
      };
    }

    function startGame() {
      loadLevel();
      menu.style.display = 'none';
      gameState = 'PLAYING';
    }

    function drawBackground() {
      ctx.fillStyle = '#5C94FC';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(80 - cameraX*0.3, 60, 70, 25);
      ctx.fillRect(500 - cameraX*0.3, 40, 90, 25);
      ctx.fillRect(1100 - cameraX*0.3, 70, 80, 25);
    }

    function drawEstudante() {
      ctx.save();
      if (!estudante.facingRight) {
        ctx.translate(estudante.x - cameraX + estudante.width, estudante.y);
        ctx.scale(-1, 1);
      } else {
        ctx.translate(estudante.x - cameraX, estudante.y);
      }

      // Cabelo, rosto, óculos, camisa, gravata, mochila, calça e sapatos (mesmo de antes)
      ctx.fillStyle = '#2C2C2C'; ctx.fillRect(14, 10, 24, 12);
      ctx.fillStyle = '#FFDBB4'; ctx.fillRect(16, 16, 20, 16);
      ctx.fillStyle = '#000'; ctx.fillRect(19,20,7,6); ctx.fillRect(28,20,7,6); ctx.fillRect(26,22,2,2);
      ctx.fillStyle = '#FFF'; ctx.fillRect(21,21,3,3); ctx.fillRect(30,21,3,3);
      ctx.fillStyle = '#F0F0F0'; ctx.fillRect(14,32,26,18);
      ctx.fillStyle = '#C8102E'; ctx.fillRect(22,34,8,12);
      ctx.fillStyle = '#8B4513'; ctx.fillRect(36,34,10,16);
      ctx.fillStyle = '#1E3A8A'; ctx.fillRect(16,48,24,10);
      ctx.fillStyle = '#111'; ctx.fillRect(16,56,9,6); ctx.fillRect(27,56,9,6);

      ctx.restore();
    }

    function drawBoss() {
      if (!boss || boss.health <= 0) return;
      ctx.fillStyle = '#8B0000';
      ctx.fillRect(boss.x - cameraX, boss.y, boss.width, boss.height);
      
      ctx.fillStyle = '#FFD700';
      ctx.font = 'bold 20px Arial';
      ctx.fillText('📐', boss.x - cameraX + 25, boss.y + 45);
      
      ctx.fillStyle = '#FFF';
      ctx.font = 'bold 14px Arial';
      ctx.fillText('MATEMÁTICA', boss.x - cameraX + 8, boss.y - 10);
    }

    function drawHealthBar() {
      if (!boss || boss.health <= 0) return;
      const barWidth = 200;
      const healthPercent = boss.health / boss.maxHealth;
      ctx.fillStyle = '#000';
      ctx.fillRect(300, 30, barWidth, 20);
      ctx.fillStyle = healthPercent > 0.4 ? '#00FF00' : '#FF0000';
      ctx.fillRect(300, 30, barWidth * healthPercent, 20);
      ctx.fillStyle = '#FFF';
      ctx.font = '16px Arial';
      ctx.fillText('BOSS MATEMÁTICA', 310, 25);
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      // Movimento do estudante
      if (keys['ArrowRight'] || keys['d']) { estudante.x += estudante.speed; estudante.facingRight = true; }
      if (keys['ArrowLeft'] || keys['a']) { estudante.x -= estudante.speed; estudante.facingRight = false; }

      if ((keys[' '] || keys['ArrowUp'] || keys['w']) && estudante.grounded) {
        estudante.velocityY = estudante.jump;
        estudante.grounded = false;
      }

      estudante.velocityY += gravity;
      estudante.y += estudante.velocityY;

      // Colisões plataformas (simplificado)
      estudante.grounded = false;
      for (let p of platforms) {
        if (estudante.x < p.x + p.width && estudante.x + estudante.width > p.x &&
            estudante.y < p.y + p.height && estudante.y + estudante.height > p.y) {
          if (estudante.velocityY > 0) {
            estudante.y = p.y - estudante.height;
            estudante.velocityY = 0;
            estudante.grounded = true;
          }
        }
      }

      // Boss Logic
      if (boss && boss.health > 0) {
        boss.x += boss.speed * boss.direction;
        boss.shootTimer++;

        if (boss.x < 1300 || boss.x > 1650) boss.direction *= -1;

        // Atira projétil
        if (boss.shootTimer > 60) {
          projectiles.push({
            x: boss.x + 40,
            y: boss.y + 30,
            width: 16,
            height: 16,
            speed: estudante.x > boss.x ? 4 : -4
          });
          boss.shootTimer = 0;
        }

        // Colisão com boss
        if (estudante.x < boss.x + boss.width && estudante.x + estudante.width > boss.x &&
            estudante.y < boss.y + boss.height && estudante.y + estudante.height > boss.y) {
          if (estudante.velocityY > 0 && estudante.y + estudante.height - 20 < boss.y) {
            boss.health--;
            estudante.velocityY = -15;
            if (boss.health <= 0) {
              alert("🏆 PARABÉNS! Você derrotou MATEMÁTICA!\nPontos: " + score);
              menu.style.display = 'block';
              gameState = 'MENU';
            }
          } else {
            alert("Você foi derrotado pela Matemática...");
            menu.style.display = 'block';
            gameState = 'MENU';
          }
        }
      }

      // Projéteis
      for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.speed;
        if (estudante.x < p.x + p.width && estudante.x + estudante.width > p.x &&
            estudante.y < p.y + p.height && estudante.y + estudante.height > p.y) {
          alert("Você foi atingido por uma equação!");
          menu.style.display = 'block';
          gameState = 'MENU';
        }
        if (p.x < 0 || p.x > WORLD_WIDTH) projectiles.splice(i, 1);
      }

      // Câmera
      cameraX = estudante.x - canvas.width / 2 + estudante.width / 2;
      if (cameraX < 0) cameraX = 0;
      if (cameraX > WORLD_WIDTH - canvas.width) cameraX = WORLD_WIDTH - canvas.width;
    }

    function draw() {
      drawBackground();
      platforms.forEach(p => {
        ctx.fillStyle = '#0B6623';
        ctx.fillRect(p.x - cameraX, p.y, p.width, p.height);
      });
      drawCoins();
      drawGoombas();
      drawBoss();
      drawEstudante();
      drawHealthBar();
    }

    function gameLoop() {
      update();
      if (gameState === 'PLAYING') draw();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    gameLoop();
  </script>
</body>
</html>
