<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adventurous Student</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #000;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #game {
      border: 10px solid #00ffcc;
      border-radius: 15px;
      box-shadow: 0 0 60px rgba(0, 255, 200, 0.6);
      image-rendering: pixelated;
    }
    #menu {
      position: absolute;
      width: 820px;
      background: rgba(0, 0, 0, 0.92);
      color: white;
      text-align: center;
      padding: 60px 40px;
      border: 8px solid #00ffcc;
      border-radius: 20px;
      z-index: 100;
    }
    h1 { 
      font-size: 72px; 
      color: #00ffcc; 
      text-shadow: 0 0 30px #00ffcc;
      margin: 0 0 30px 0;
      letter-spacing: 4px;
    }
    button {
      font-size: 28px;
      padding: 20px 80px;
      margin-top: 30px;
      background: linear-gradient(#0066ff, #0044aa);
      color: white;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      transform: scale(1.1);
      background: #00aaff;
    }
    #scoreDisplay {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: #00ffcc;
      font-size: 30px;
      font-weight: bold;
      text-shadow: 0 0 15px #00ffcc;
      z-index: 50;
    }
  </style>
</head>
<body>

  <div id="scoreDisplay">Pontos: <span id="points">00000</span></div>

  <div id="menu">
    <h1>ADVENTUROUS STUDENT</h1>
    <button onclick="startGame()">INICIAR JOGO</button>
  </div>

  <canvas id="game" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const menu = document.getElementById('menu');
    const pointsElement = document.getElementById('points');

    let score = 0;
    let gameState = 'MENU';
    let cameraX = 0;
    const WORLD_WIDTH = 1800;

    const estudante = {
      x: 100, y: 250, width: 48, height: 48,
      speed: 6, jump: -18, velocityY: 0,
      grounded: false, facingRight: true
    };

    const gravity = 0.85;
    const keys = {};

    let platforms = [], coins = [], goombas = [];
    let boss = null;
    let projectiles = [];
    let enemyProjectiles = [];

    function loadLevel() {
      score = 0;
      pointsElement.textContent = "00000";
      estudante.x = 100;
      cameraX = 0;
      projectiles = [];
      enemyProjectiles = [];

      platforms = [
        {x: 0, y: 350, width: WORLD_WIDTH, height: 50},
        {x: 250, y: 280, width: 180, height: 20},
        {x: 550, y: 210, width: 140, height: 20},
        {x: 850, y: 260, width: 200, height: 20},
        {x: 1150, y: 180, width: 150, height: 20},
        {x: 1450, y: 240, width: 120, height: 20},
      ];

      coins = [
        {x: 320, y: 220, collected: false},
        {x: 620, y: 150, collected: false},
        {x: 920, y: 200, collected: false},
        {x: 1220, y: 120, collected: false},
      ];

      goombas = [
        {x: 450, y: 310, width: 40, height: 38, speed: -2, alive: true},
        {x: 780, y: 310, width: 40, height: 38, speed: 2, alive: true},
      ];

      boss = {
        x: 1550, y: 125, width: 85, height: 105,
        health: 12, maxHealth: 12,
        shootTimer: 0
      };
    }

    function startGame() {
      loadLevel();
      menu.style.display = 'none';
      gameState = 'PLAYING';
    }

    function drawBackground() {
      // Céu
      const grad = ctx.createLinearGradient(0, 0, 0, 400);
      grad.addColorStop(0, '#4A7CFF');
      grad.addColorStop(1, '#A8D0FF');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Montanhas ao fundo
      ctx.fillStyle = '#455A7A';
      ctx.fillRect(80 - cameraX*0.08, 210, 220, 190);
      ctx.fillRect(680 - cameraX*0.08, 190, 260, 210);
      ctx.fillRect(1250 - cameraX*0.08, 230, 190, 170);

      // Nuvens
      ctx.fillStyle = '#FFFFFF';
      ctx.globalAlpha = 0.9;
      ctx.fillRect(60 - cameraX*0.15, 55, 110, 28);
      ctx.fillRect(420 - cameraX*0.15, 40, 130, 32);
      ctx.fillRect(950 - cameraX*0.15, 70, 90, 26);
      ctx.globalAlpha = 1;
    }

    function drawPlatforms() {
      platforms.forEach(p => {
        // Terra marrom
        ctx.fillStyle = '#8B5F2B';
        ctx.fillRect(p.x - cameraX, p.y + 10, p.width, p.height - 10);
        
        // Grama principal
        ctx.fillStyle = '#0B6623';
        ctx.fillRect(p.x - cameraX, p.y, p.width, 14);
        
        // Grama clara
        ctx.fillStyle = '#0F8B2E';
        ctx.fillRect(p.x - cameraX, p.y, p.width, 8);

        // Detalhes de grama
        ctx.fillStyle = '#1EB43C';
        for (let i = 20; i < p.width - 20; i += 32) {
          ctx.fillRect(p.x - cameraX + i, p.y - 6, 7, 9);
        }
      });
    }

    function drawBushes() {
      ctx.fillStyle = '#0F8B2E';
      ctx.fillRect(180 - cameraX, 315, 45, 35);
      ctx.fillRect(720 - cameraX, 318, 38, 32);
      ctx.fillRect(1320 - cameraX, 312, 42, 38);
    }

    function drawEstudante() {
      ctx.save();
      if (!estudante.facingRight) {
        ctx.translate(estudante.x - cameraX + estudante.width, estudante.y);
        ctx.scale(-1, 1);
      } else {
        ctx.translate(estudante.x - cameraX, estudante.y);
      }

      ctx.fillStyle = '#2C2C2C'; ctx.fillRect(14, 10, 24, 12);
      ctx.fillStyle = '#FFDBB4'; ctx.fillRect(16, 16, 20, 16);
      ctx.fillStyle = '#000'; ctx.fillRect(19,20,7,6); ctx.fillRect(28,20,7,6);
      ctx.fillStyle = '#FFF'; ctx.fillRect(21,21,3,3); ctx.fillRect(30,21,3,3);
      ctx.fillStyle = '#F0F0F0'; ctx.fillRect(14,32,26,18);
      ctx.fillStyle = '#C8102E'; ctx.fillRect(22,34,8,12);
      ctx.fillStyle = '#8B4513'; ctx.fillRect(36,34,10,16);
      ctx.fillStyle = '#1E3A8A'; ctx.fillRect(16,48,24,10);
      ctx.fillStyle = '#111'; ctx.fillRect(16,56,9,6); ctx.fillRect(27,56,9,6);

      ctx.fillStyle = '#8B4513';
      ctx.fillRect(38, 38, 12, 10);

      ctx.restore();
    }

    function drawGoombas() {
      goombas.forEach(g => {
        if (!g.alive) return;
        ctx.save();
        ctx.translate(g.x - cameraX, g.y);

        // Boné
        ctx.fillStyle = '#FF0000';
        ctx.fillRect(6, 5, 28, 10);
        ctx.fillRect(4, 12, 32, 6);

        // Rosto
        ctx.fillStyle = '#FFDBB4';
        ctx.fillRect(10, 16, 20, 16);

        // Olhos
        ctx.fillStyle = '#000';
        ctx.fillRect(14, 20, 5, 7);
        ctx.fillRect(21, 20, 5, 7);

        // Mochila
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(28, 18, 12, 16);

        ctx.restore();
      });
    }

    function drawBoss() {
      if (!boss || boss.health <= 0) return;
      ctx.save();
      ctx.translate(boss.x - cameraX, boss.y);

      // Jaleco
      ctx.fillStyle = '#F0F0F0';
      ctx.fillRect(12, 35, 62, 58);

      // Calça
      ctx.fillStyle = '#2C3E50';
      ctx.fillRect(18, 82, 52, 22);

      // Cabeça
      ctx.fillStyle = '#FFDBB4';
      ctx.fillRect(25, 18, 38, 32);

      // Cabelo
      ctx.fillStyle = '#444';
      ctx.fillRect(20, 15, 48, 12);

      // Óculos
      ctx.fillStyle = '#111';
      ctx.fillRect(28, 25, 13, 9);
      ctx.fillRect(43, 25, 13, 9);

      // Barba
      ctx.fillStyle = '#555';
      ctx.fillRect(27, 40, 30, 12);

      // Régua
      ctx.fillStyle = '#F1C40F';
      ctx.fillRect(70, 45, 8, 42);

      ctx.restore();

      ctx.fillStyle = '#FFF';
      ctx.font = 'bold 15px Arial';
      ctx.fillText('PROF. MATEMÁTICA', boss.x - cameraX - 18, boss.y - 12);
    }

    function drawHealthBar() {
      if (!boss || boss.health <= 0) return;
      const barWidth = 220;
      const percent = boss.health / boss.maxHealth;
      ctx.fillStyle = '#000';
      ctx.fillRect(290, 25, barWidth, 22);
      ctx.fillStyle = percent > 0.4 ? '#00FF00' : '#FF0000';
      ctx.fillRect(290, 25, barWidth * percent, 22);
      ctx.fillStyle = '#FFF';
      ctx.font = '18px Arial';
      ctx.fillText('PROFESSOR MATEMÁTICA', 300, 20);
    }

    function drawCoins() {
      ctx.fillStyle = '#FFD700';
      coins.forEach(coin => {
        if (!coin.collected) {
          ctx.fillRect(coin.x - cameraX + 4, coin.y + 4, 16, 16);
          ctx.fillStyle = '#B8860B';
          ctx.fillRect(coin.x - cameraX + 7, coin.y + 8, 10, 4);
          ctx.fillStyle = '#FFD700';
        }
      });
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      if (keys['ArrowRight'] || keys['d']) { estudante.x += estudante.speed; estudante.facingRight = true; }
      if (keys['ArrowLeft'] || keys['a']) { estudante.x -= estudante.speed; estudante.facingRight = false; }

      if ((keys[' '] || keys['ArrowUp'] || keys['w']) && estudante.grounded) {
        estudante.velocityY = estudante.jump;
        estudante.grounded = false;
      }

      estudante.velocityY += gravity;
      estudante.y += estudante.velocityY;

      estudante.grounded = false;
      for (let p of platforms) {
        if (estudante.x < p.x + p.width && estudante.x + estudante.width > p.x &&
            estudante.y < p.y + p.height && estudante.y + estudante.height > p.y) {
          if (estudante.velocityY > 0) {
            estudante.y = p.y - estudante.height;
            estudante.velocityY = 0;
            estudante.grounded = true;
          }
        }
      }

      coins.forEach(coin => {
        if (!coin.collected && 
            estudante.x < coin.x + 20 && estudante.x + estudante.width > coin.x &&
            estudante.y < coin.y + 20 && estudante.y + estudante.height > coin.y) {
          coin.collected = true;
          score += 100;
          pointsElement.textContent = String(score).padStart(5, '0');
        }
      });

      goombas.forEach(g => {
        if (!g.alive) return;
        g.x += g.speed;
        if (g.x <= 200 || g.x >= 1400) g.speed *= -1;

        if (estudante.x < g.x + g.width && estudante.x + estudante.width > g.x &&
            estudante.y < g.y + g.height && estudante.y + estudante.height > g.y) {
          if (estudante.velocityY > 0 && estudante.y + estudante.height - 20 < g.y) {
            g.alive = false;
            estudante.velocityY = -13;
            score += 200;
            pointsElement.textContent = String(score).padStart(5, '0');
          } else {
            alert("Você foi pego por um Aluno Rebelde!");
            menu.style.display = 'block';
            gameState = 'MENU';
          }
        }
      });

      if (keys['j'] || keys['J']) {
        if (!estudante.lastShot || Date.now() - estudante.lastShot > 250) {
          projectiles.push({
            x: estudante.facingRight ? estudante.x + 45 : estudante.x - 5,
            y: estudante.y + 28,
            width: 14,
            height: 12,
            speed: estudante.facingRight ? 10 : -10
          });
          estudante.lastShot = Date.now();
        }
      }

      for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.speed;
        if (boss && boss.health > 0 && 
            p.x < boss.x + boss.width && p.x + p.width > boss.x &&
            p.y < boss.y + boss.height && p.y + p.height > boss.y) {
          boss.health--;
          projectiles.splice(i, 1);
          if (boss.health <= 0) {
            alert("🏆 VITÓRIA! Você derrotou o Professor Matemática!\nPontos: " + score);
            menu.style.display = 'block';
            gameState = 'MENU';
          }
        }
      }

      if (boss && boss.health > 0) {
        boss.shootTimer++;
        if (boss.shootTimer > 60) {
          enemyProjectiles.push({
            x: boss.x + 45,
            y: boss.y + 55,
            width: 16,
            height: 16,
            speed: -5
          });
          boss.shootTimer = 0;
        }
      }

      for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
        let p = enemyProjectiles[i];
        p.x += p.speed;
        if (estudante.x < p.x + p.width && estudante.x + estudante.width > p.x &&
            estudante.y < p.y + p.height && estudante.y + estudante.height > p.y) {
          alert("Você foi atingido por uma equação difícil!");
          menu.style.display = 'block';
          gameState = 'MENU';
        }
      }

      cameraX = Math.max(0, Math.min(estudante.x - 300, WORLD_WIDTH - canvas.width));
    }

    function draw() {
      drawBackground();
      drawPlatforms();
      drawCoins();
      drawGoombas();
      drawBoss();
      drawHealthBar();
      drawEstudante();

      ctx.fillStyle = '#8B4513';
      projectiles.forEach(p => ctx.fillRect(p.x - cameraX, p.y, p.width, p.height));

      ctx.fillStyle = '#FFFF00';
      enemyProjectiles.forEach(p => ctx.fillRect(p.x - cameraX, p.y, p.width, p.height));
    }

    function gameLoop() {
      update();
      if (gameState === 'PLAYING') draw();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    gameLoop();
  </script>
</body>
</html>
