<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batalha no Mar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>⚓ BATALHA NO MAR ⚓</h1>
    <div class="game-info">
      <span>Pontos: <strong id="score">0</strong></span>
      <span>Vidas: <strong id="lives">3</strong></span>
    </div>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <p class="controls">← → Mover   |   ESPAÇO ou Clique = Atirar</p>
    <button class="reset-btn" onclick="restartGame()">Novo Jogo</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
