<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudante Aventureiro</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #000;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }
    #game {
      border: 8px solid #222;
      box-shadow: 0 0 40px rgba(0,0,0,0.9);
      image-rendering: pixelated;
    }
    #menu {
      position: absolute;
      color: white;
      text-align: center;
      width: 820px;
      background: rgba(0,0,0,0.85);
      padding: 30px;
      border: 6px solid #00FF00;
      border-radius: 15px;
      z-index: 100;
    }
    h1 { 
      font-size: 58px; 
      color: #00FF00; 
      text-shadow: 6px 6px 0 #000; 
      margin: 10px 0 20px;
    }
    button {
      font-size: 26px;
      padding: 18px 60px;
      margin: 15px;
      background: #0066FF;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #3388FF;
      transform: scale(1.05);
    }
    #scoreDisplay {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 2px 2px 4px black;
      z-index: 50;
    }
  </style>
</head>
<body>

  <div id="scoreDisplay">Pontos: <span id="points">00000</span></div>

  <div id="menu">
    <h1>ESTUDANTE AVENTUREIRO</h1>
    <p style="font-size:22px; margin:15px;">Derrote o Professor Matemática!</p>
    <p style="font-size:18px; margin:20px;">
      ← → ou A D : Mover<br>
      ESPAÇO : Pular<br>
      J : Atirar Livro
    </p>
    <button onclick="startGame()">INICIAR JOGO</button>
  </div>

  <canvas id="game" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const menu = document.getElementById('menu');
    const pointsElement = document.getElementById('points');

    let score = 0;
    let gameState = 'MENU';
    let cameraX = 0;
    const WORLD_WIDTH = 1800;

    const estudante = {
      x: 100, y: 250, width: 48, height: 48,
      speed: 6, jump: -18, velocityY: 0,
      grounded: false, facingRight: true
    };

    const gravity = 0.85;
    const keys = {};

    let platforms = [], coins = [], goombas = [];
    let boss = null;
    let projectiles = [];
    let enemyProjectiles = [];

    // Sons simples
    function playSound(type) {
      const audio = new AudioContext();
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      oscillator.connect(gain);
      gain.connect(audio.destination);

      if (type === 'jump') {
        oscillator.frequency.setValueAtTime(600, audio.currentTime);
        gain.gain.value = 0.3;
        oscillator.type = 'sine';
        oscillator.start();
        setTimeout(() => oscillator.stop(), 80);
      } else if (type === 'coin') {
        oscillator.frequency.setValueAtTime(800, audio.currentTime);
        gain.gain.value = 0.4;
        oscillator.start();
        setTimeout(() => { oscillator.frequency.setValueAtTime(1200, audio.currentTime + 0.05); }, 50);
        setTimeout(() => oscillator.stop(), 150);
      } else if (type === 'shoot') {
        oscillator.frequency.setValueAtTime(400, audio.currentTime);
        gain.gain.value = 0.2;
        oscillator.start();
        setTimeout(() => oscillator.stop(), 60);
      } else if (type === 'victory') {
        oscillator.frequency.setValueAtTime(600, audio.currentTime);
        setTimeout(() => oscillator.frequency.setValueAtTime(900, audio.currentTime + 0.2), 200);
        setTimeout(() => oscillator.frequency.setValueAtTime(1200, audio.currentTime + 0.4), 400);
        oscillator.start();
        setTimeout(() => oscillator.stop(), 600);
      }
    }

    function loadLevel() {
      score = 0;
      pointsElement.textContent = "00000";
      estudante.x = 100;
      cameraX = 0;
      projectiles = [];
      enemyProjectiles = [];

      platforms = [ /* mesmas plataformas */ 
        {x: 0, y: 350, width: WORLD_WIDTH, height: 50},
        {x: 250, y: 280, width: 180, height: 20},
        {x: 550, y: 210, width: 140, height: 20},
        {x: 850, y: 260, width: 200, height: 20},
        {x: 1150, y: 180, width: 150, height: 20},
        {x: 1450, y: 240, width: 120, height: 20},
      ];

      coins = [ /* mesmas moedas */ ];

      goombas = [ /* mesmos goombas */ ];

      boss = {
        x: 1550, y: 125, width: 85, height: 105,
        health: 12, maxHealth: 12,
        shootTimer: 0
      };
    }

    function startGame() {
      loadLevel();
      menu.style.display = 'none';
      gameState = 'PLAYING';
    }

    // drawBackground, drawPlatforms, drawEstudante, drawGoombas, drawBoss, etc. (mantidos melhorados)

    function update() {
      if (gameState !== 'PLAYING') return;

      if (keys['ArrowRight'] || keys['d']) { estudante.x += estudante.speed; estudante.facingRight = true; }
      if (keys['ArrowLeft'] || keys['a']) { estudante.x -= estudante.speed; estudante.facingRight = false; }

      if ((keys[' '] || keys['ArrowUp'] || keys['w']) && estudante.grounded) {
        estudante.velocityY = estudante.jump;
        estudante.grounded = false;
        playSound('jump');
      }

      estudante.velocityY += gravity;
      estudante.y += estudante.velocityY;

      // ... (resto do update igual)

      if (keys['j'] || keys['J']) {
        if (!estudante.lastShot || Date.now() - estudante.lastShot > 250) {
          projectiles.push({ /* ... */ });
          estudante.lastShot = Date.now();
          playSound('shoot');
        }
      }
    }

    function draw() {
      drawBackground();
      drawPlatforms();
      drawCoins();
      drawGoombas();
      drawBoss();
      drawHealthBar();
      drawEstudante();

      ctx.fillStyle = '#8B4513';
      projectiles.forEach(p => ctx.fillRect(p.x - cameraX, p.y, p.width, p.height));

      ctx.fillStyle = '#FFFF00';
      enemyProjectiles.forEach(p => ctx.fillRect(p.x - cameraX, p.y, p.width, p.height));
    }

    function gameLoop() {
      update();
      if (gameState === 'PLAYING') draw();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    gameLoop();
  </script>
</body>
</html>
