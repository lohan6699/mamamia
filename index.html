<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudante Aventureiro</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #000;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    #game {
      border: 8px solid #222;
      box-shadow: 0 0 40px rgba(0,0,0,0.9);
      image-rendering: pixelated;
    }

    #menu {
      position: absolute;
      color: white;
      text-align: center;
      width: 800px;
      z-index: 100;
    }

    h1 {
      font-size: 52px;
      color: #00FF00;
      text-shadow: 4px 4px 0 #000;
      margin-bottom: 10px;
    }

    p {
      font-size: 24px;
      margin: 20px;
    }

    button {
      font-size: 26px;
      padding: 15px 50px;
      margin: 15px;
      background: #0066FF;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #3388FF;
    }
  </style>
</head>
<body>

  <div id="menu">
    <h1>ESTUDANTE AVENTUREIRO</h1>
    <p> Colete as moedas e evite os Goombas!</p>
    <button onclick="startGame()">INICIAR JOGO</button>
  </div>

  <canvas id="game" width="800" height="400"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const menu = document.getElementById('menu');

    let score = 0;
    let gameState = 'MENU';
    let cameraX = 0;
    const WORLD_WIDTH = 1600;

    const estudante = {
      x: 100,
      y: 250,
      width: 48,
      height: 48,
      speed: 6,
      jump: -18,
      velocityY: 0,
      grounded: false,
      facingRight: true,
      isMoving: false
    };

    const gravity = 0.85;
    const keys = {};

    let platforms = [];
    let coins = [];
    let goombas = [];

    function loadLevel() {
      score = 0;
      estudante.x = 100;
      cameraX = 0;

      platforms = [
        {x: 0, y: 350, width: WORLD_WIDTH, height: 50},
        {x: 250, y: 280, width: 180, height: 20},
        {x: 550, y: 210, width: 140, height: 20},
        {x: 850, y: 260, width: 200, height: 20},
        {x: 1150, y: 180, width: 150, height: 20},
        {x: 1400, y: 240, width: 120, height: 20},
      ];

      coins = [
        {x: 320, y: 220, collected: false},
        {x: 620, y: 150, collected: false},
        {x: 920, y: 200, collected: false},
        {x: 1220, y: 120, collected: false},
        {x: 1480, y: 180, collected: false},
      ];

      goombas = [
        {x: 450, y: 310, width: 40, height: 38, speed: -2, alive: true},
        {x: 780, y: 310, width: 40, height: 38, speed: 2, alive: true},
        {x: 1250, y: 310, width: 40, height: 38, speed: -2, alive: true},
      ];
    }

    function startGame() {
      loadLevel();
      menu.style.display = 'none';
      gameState = 'PLAYING';
    }

    function drawBackground() {
      ctx.fillStyle = '#5C94FC';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Nuvens
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(80 - cameraX * 0.3, 60, 70, 25);
      ctx.fillRect(380 - cameraX * 0.3, 40, 90, 25);
      ctx.fillRect(750 - cameraX * 0.3, 70, 60, 25);
      ctx.fillRect(1100 - cameraX * 0.3, 50, 80, 25);
    }

    function drawEstudante() {
      ctx.save();
      if (!estudante.facingRight) {
        ctx.translate(estudante.x - cameraX + estudante.width, estudante.y);
        ctx.scale(-1, 1);
      } else {
        ctx.translate(estudante.x - cameraX, estudante.y);
      }

      // Cabelo
      ctx.fillStyle = '#2C2C2C';
      ctx.fillRect(14, 10, 24, 12);

      // Rosto
      ctx.fillStyle = '#FFDBB4';
      ctx.fillRect(16, 16, 20, 16);

      // Óculos
      ctx.fillStyle = '#000';
      ctx.fillRect(19, 20, 7, 6);
      ctx.fillRect(28, 20, 7, 6);
      ctx.fillRect(26, 22, 2, 2);

      ctx.fillStyle = '#FFF';
      ctx.fillRect(21, 21, 3, 3);
      ctx.fillRect(30, 21, 3, 3);

      // Camisa Social
      ctx.fillStyle = '#F0F0F0';
      ctx.fillRect(14, 32, 26, 18);

      // Gravata
      ctx.fillStyle = '#C8102E';
      ctx.fillRect(22, 34, 8, 12);

      // Mochila
      ctx.fillStyle = '#8B4513';
      ctx.fillRect(36, 34, 10, 16);
      ctx.fillStyle = '#654321';
      ctx.fillRect(37, 36, 8, 12);
      ctx.fillRect(32, 34, 4, 14);

      // Calça
      ctx.fillStyle = '#1E3A8A';
      ctx.fillRect(16, 48, 24, 10);

      // Sapatos
      ctx.fillStyle = '#111';
      ctx.fillRect(16, 56, 9, 6);
      ctx.fillRect(27, 56, 9, 6);

      ctx.restore();
    }

    function drawPlatforms() {
      ctx.fillStyle = '#0B6623';
      platforms.forEach(p => {
        ctx.fillRect(p.x - cameraX, p.y, p.width, p.height);
        ctx.fillStyle = '#0F8B2E';
        ctx.fillRect(p.x - cameraX, p.y, p.width, 6);
        ctx.fillStyle = '#0B6623';
      });
    }

    function drawCoins() {
      coins.forEach(coin => {
        if (!coin.collected) {
          ctx.fillStyle = '#FFD700';
          ctx.fillRect(coin.x - cameraX + 4, coin.y + 4, 16, 16);
        }
      });
    }

    function drawGoombas() {
      goombas.forEach(g => {
        if (!g.alive) return;
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(g.x - cameraX, g.y, g.width, g.height);
        ctx.fillStyle = '#FFF';
        ctx.fillRect(g.x - cameraX + 8, g.y + 10, 8, 10);
        ctx.fillRect(g.x - cameraX + 24, g.y + 10, 8, 10);
        ctx.fillStyle = '#000';
        ctx.fillRect(g.x - cameraX + 10, g.y + 13, 4, 5);
        ctx.fillRect(g.x - cameraX + 26, g.y + 13, 4, 5);
      });
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      estudante.isMoving = false;

      if (keys['ArrowRight'] || keys['d']) {
        estudante.x += estudante.speed;
        estudante.facingRight = true;
        estudante.isMoving = true;
      }
      if (keys['ArrowLeft'] || keys['a']) {
        estudante.x -= estudante.speed;
        estudante.facingRight = false;
        estudante.isMoving = true;
      }

      if ((keys[' '] || keys['ArrowUp'] || keys['w']) && estudante.grounded) {
        estudante.velocityY = estudante.jump;
        estudante.grounded = false;
      }

      estudante.velocityY += gravity;
      estudante.y += estudante.velocityY;

      // Colisão com plataformas
      estudante.grounded = false;
      for (let p of platforms) {
        if (
          estudante.x < p.x + p.width && estudante.x + estudante.width > p.x &&
          estudante.y < p.y + p.height && estudante.y + estudante.height > p.y
        ) {
          if (estudante.velocityY > 0) {
            estudante.y = p.y - estudante.height;
            estudante.velocityY = 0;
            estudante.grounded = true;
          }
        }
      }

      // Moedas
      coins.forEach(coin => {
        if (!coin.collected && 
            estudante.x < coin.x + 24 && estudante.x + estudante.width > coin.x &&
            estudante.y < coin.y + 24 && estudante.y + estudante.height > coin.y) {
          coin.collected = true;
          score += 100;
        }
      });

      // Goombas
      goombas.forEach(g => {
        if (!g.alive) return;
        g.x += g.speed;

        if (estudante.x < g.x + g.width && estudante.x + estudante.width > g.x &&
            estudante.y < g.y + g.height && estudante.y + estudante.height > g.y) {
          if (estudante.velocityY > 0 && estudante.y + estudante.height - 20 < g.y) {
            g.alive = false;
            estudante.velocityY = -13;
            score += 200;
          } else {
            gameState = 'GAME_OVER';
            alert('Game Over! Pontos: ' + score);
          }
        }
        if (g.x <= 0 || g.x + g.width >= WORLD_WIDTH) g.speed *= -1;
      });

      // Limites
      if (estudante.x < 0) estudante.x = 0;
      if (estudante.x > WORLD_WIDTH - estudante.width) estudante.x = WORLD_WIDTH - estudante.width;

      // Câmera
      cameraX = estudante.x - canvas.width / 2 + estudante.width / 2;
      if (cameraX < 0) cameraX = 0;
      if (cameraX > WORLD_WIDTH - canvas.width) cameraX = WORLD_WIDTH - canvas.width;

      // Fim da fase
      if (estudante.x > WORLD_WIDTH - 100) {
        alert(`🏆 Parabéns! Você completou a fase!\nPontos: ${score}`);
        menu.style.display = 'block';
        gameState = 'MENU';
      }
    }

    function draw() {
      drawBackground();
      drawPlatforms();
      drawCoins();
      drawGoombas();
      drawEstudante();
    }

    function gameLoop() {
      update();
      if (gameState === 'PLAYING') draw();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);

    gameLoop();
  </script>

  <p style="position:absolute;bottom:10px;color:white;text-align:center;width:100%;">
    ← → ou A D : mover | ESPAÇO : pular
  </p>
</body>
</html>
